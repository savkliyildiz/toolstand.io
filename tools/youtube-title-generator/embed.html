var TEMPLATES=["Why ${kw} Is Harder Than You Think","${kw} Explained in 10 Minutes","How to Master ${kw} in 2026","The Secret ${kw} Experts Dont Want You to Know","${kw} for Complete Beginners","I Tried ${kw} for 30 Days","The Truth About ${kw} Nobody Talks About","Stop Wasting Time on ${kw}","${kw} Mistakes That Will Ruin Your Progress","10 ${kw} Tips That Actually Work","What They Dont Teach You About ${kw}","${kw} The Complete Guide","Why ${kw} Changed Everything","${kw} in 60 Seconds"];
var TAG_SUFFIXES=["tips","tutorial","guide","explained","2026","how to","beginners","advanced","review","mistakes","hacks"];

function gen(){
  var kw=document.getElementById('ytKeyword').value.trim();
  if(!kw)return;
  var titles=TEMPLATES.map(function(t){return t.replace(/\$\{kw\}/g,kw);});
  var tags=[kw].concat(TAG_SUFFIXES.map(function(s){return kw+' '+s;}));
  var html='<div class="yt-titles"><h3 style="font-size:.9rem;margin-bottom:4px">'+titles.length+' Titles</h3>';
  titles.forEach(function(t,i){
    html+='<div class="yt-title-item"><span class="yt-title-text">'+(i+1)+'. '+t+'</span><button class="yt-title-copy" data-title="'+t.replace(/"/g,'&quot;')+'">Copy</button></div>';
  });
  html+='</div><div class="yt-tags-wrap"><h3>'+tags.length+' Tags</h3><div class="yt-tags">';
  tags.forEach(function(t){html+='<span class="yt-tag" data-tag="'+t.replace(/"/g,'&quot;')+'">'+t+'</span>';});
  html+='</div><p style="font-size:.75rem;color:var(--text-secondary);margin-top:8px">Click any tag or title to copy</p></div>';
  document.getElementById('ytOutput').innerHTML=html;
}

// Event delegation for copy buttons
document.getElementById('ytOutput').addEventListener('click',function(e){
  var btn=e.target.closest('.yt-title-copy');

});

});
