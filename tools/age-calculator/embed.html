<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator — Embed</title>
<link rel="stylesheet" href="/shared/styles.css">
<script type="application/ld+json">{"@context":"https://schema.org","@type":["WebApplication","SoftwareApplication"],"name":"Age Calculator","url":"https://toolstand.io/tools/age-calculator/","applicationCategory":"CalculatorApplication","operatingSystem":"All","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"isAccessibleForFree":true}</script>
<style>
.header,.footer,.embed-cta,#embed-section,.ad-banner{display:none}
.age-input-area {
  text-align: center;
  margin-bottom: 24px;
}
.age-input-area input[type="date"] {
  padding: 12px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 1rem;
  background: var(--bg);
  color: var(--text);
  width: 100%;
  max-width: 280px;
  text-align: center;
  transition: border-color 0.15s;
}
.age-input-area input[type="date"]:focus { outline: none; border-color: var(--primary); }
.age-results {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
  gap: 16px;
  margin: 24px 0;
}
.age-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 12px;
  text-align: center;
}
.age-card .number {
  font-size: 2rem;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--primary);
}
.age-card .label {
  font-size: 0.8rem;
  color: var(--text-secondary);
  font-weight: 600;
  text-transform: uppercase;
  margin-top: 4px;
}
.age-fun-fact, .age-zodiac, .age-countdown {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 16px;
  text-align: center;
  font-size: 0.95rem;
}
.age-fun-fact { color: var(--primary); font-weight: 600; }
.age-zodiac .zodiac-icon { font-size: 2rem; }
.age-zodiac .zodiac-name { font-weight: 700; }
.age-countdown .cd-label { font-size: 0.8rem; color: var(--text-secondary); }
.age-countdown .cd-value { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
.powered-by{text-align:center;padding:12px;margin-top:16px;font-size:.75rem;color:var(--text-secondary)}
.powered-by a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
<script src="/shared/bot-detect.js" defer></script>
<script src="/shared/analytics.js"></script>
</head><body class="embed-page">
<main class="tool-container">
<div class="tool-header">
    <h1>🎂 Age Calculator</h1>
    <p>Find out your exact age and discover fun facts about your birth date.</p>
  </div>
  <div class="age-input-area">
    <label for="birthDate" style="display:block;margin-bottom:8px;font-weight:600;color:var(--text-secondary)">Select your birth date</label>
    <input type="date" id="birthDate">
  </div>
  <div class="age-results" id="ageResults" style="display:none">
    <div class="age-card"><div class="number" id="ageYears">—</div><div class="label">Years</div></div>
    <div class="age-card"><div class="number" id="ageMonths">—</div><div class="label">Months</div></div>
    <div class="age-card"><div class="number" id="ageDays">—</div><div class="label">Days</div></div>
    <div class="age-card"><div class="number" id="ageHours">—</div><div class="label">Hours</div></div>
    <div class="age-card"><div class="number" id="ageMinutes">—</div><div class="label">Minutes</div></div>
  </div>
  <div class="age-fun-fact" id="ageFunFact" style="display:none"></div>
  <div class="age-zodiac" id="ageZodiac" style="display:none">
    <div class="zodiac-icon" id="zodiacIcon"></div>
    <div class="zodiac-name" id="zodiacName"></div>
  </div>
  <div class="age-countdown" id="ageCountdown" style="display:none">
    <div class="cd-label">🎈 Next birthday in</div>
    <div class="cd-value" id="cdValue">
</main>
<div class="powered-by"><a href="https://toolstand.io/tools/age-calculator/" target="_blank" rel="noopener">Powered by ToolStand Age Calculator</a></div>
<script>
(function(){
  'use strict';

  var s=localStorage.getItem('toolstand-theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
})();
</script>
</body></html>
