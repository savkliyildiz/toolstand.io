<style>
.header,.footer,.embed-cta,#embed-section,.ad-banner{display:none}
.color-swatch {
  width: 100%;
  height: 120px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  margin-bottom: 20px;
  transition: background 0.2s;
}
.color-inputs {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.color-picker-row {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}
.color-picker-row input[type="color"] {
  width: 50px; height: 50px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  cursor: pointer;
  padding: 2px;
  background: var(--bg);
}
.color-picker-row input[type="text"] {
  flex: 1;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 1rem;
  font-family: 'Courier New', monospace;
  background: var(--bg);
  color: var(--text);
  transition: border-color 0.15s;
}
.color-picker-row input[type="text"]:focus { outline: none; border-color: var(--primary); }
.rgb-sliders {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.rgb-slider-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.rgb-slider-row label {
  font-weight: 700;
  font-size: 0.9rem;
  width: 20px;
  text-align: center;
}
.rgb-slider-row input[type="range"] { flex: 1; accent-color: var(--primary); }
.rgb-slider-row .rgb-val { width: 40px; text-align: right; font-size: 0.9rem; font-weight: 600; color: var(--text); }
.color-formats {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.format-row {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
}
.format-label {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text-secondary);
  min-width: 40px;
}
.format-value {
  flex: 1;
  font-family: 'Courier New', monospace;
  font-size: 0.95rem;
  color: var(--text);
}
.format-row .btn-outline { padding: 6px 12px; font-size: 0.8rem; }
.powered-by{text-align:center;padding:12px;margin-top:16px;font-size:.75rem;color:var(--text-secondary)}
.powered-by a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
<script src="/shared/bot-detect.js" defer></script>
<script src="/shared/analytics.js"></script>
</head><body class="embed-page">
<main class="tool-container">
<div class="tool-header">
    <h1>🎨 Color Converter</h1>
    <p>Convert between HEX, RGB, HSL — pick, parse, or type any CSS color.</p>
  </div>
  <div class="color-swatch" id="colorSwatch"></div>
  <div class="color-inputs">
    <div class="color-picker-row">
      <input type="color" id="colorPicker" value="#2563eb">
      <input type="text" id="hexInput" placeholder="#000000 or red or rgb(0,0,0)" value="#2563eb">
      <button class="btn" id="parseBtn">Parse</button>
    </div>
    <div class="rgb-sliders">
      <div class="rgb-slider-row">
        <label style="color:#ef4444">R</label>
        <input type="range" id="redSlider" min="0" max="255" value="37">
        <span class="rgb-val" id="redVal">37</span>
      </div>
      <div class="rgb-slider-row">
        <label style="color:#22c55e">G</label>
        <input type="range" id="greenSlider" min="0" max="255" value="99">
        <span class="rgb-val" id="greenVal">99</span>
      </div>
      <div class="rgb-slider-row">
        <label style="color:#3b82f6">B</label>
        <input type="range" id="blueSlider" min="0" max="255" value="235">
        <span class="rgb-val" id="blueVal">235</span>
      </div>
    </div>
    <div class="color-formats">
      <div class="format-row">
        <span class="format-label">HEX</span>
        <span class="format-value" id="hexValue">#2563eb</span>
        <button class="btn btn-outline copy-format" data-target="hexValue">📋</button>
      </div>
      <div class="format-row">
        <span class="format-label">RGB</span>
        <span class="format-value" id="rgbValue">rgb(37, 99, 235)</span>
        <button class="btn btn-outline copy-format" data-target="rgbValue">📋</button>
      </div>
      <div class="format-row">
        <span class="format-label">HSL</span>
        <span class="format-value" id="hslValue">hsl(221, 83%, 53%)</span>
        <button class="btn btn-outline copy-format" data-target="hslValue">📋</button>
</main>
<div class="powered-by"><a href="https://toolstand.io/tools/color-converter/" target="_blank" rel="noopener">Powered by ToolStand Color Code Converter</a></div>
