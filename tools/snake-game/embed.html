<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game — Embed</title>
<link rel="stylesheet" href="/shared/styles.css">
<script type="application/ld+json">{"@context":"https://schema.org","@type":["WebApplication","SoftwareApplication"],"name":"Snake Game","url":"https://toolstand.io/tools/snake-game/","applicationCategory":"GameApplication","operatingSystem":"All","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"isAccessibleForFree":true}</script>
<style>
.header,.footer,.embed-cta,#embed-section,.ad-banner{display:none}
.sn-container { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.sn-score { font-size: 1.2rem; font-weight: 700; color: var(--text); }
.sn-canvas { border: 2px solid var(--border); border-radius: var(--radius); background: var(--bg-card); display: block; width: 100%; max-width: 400px; aspect-ratio: 1/1; }
.sn-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.sn-btn { padding: 10px 24px; font-size: 0.9rem; font-weight: 600; background: #22c55e; color: white; border: none; border-radius: var(--radius); cursor: pointer; transition: background 0.15s; }
.sn-btn:hover { background: #16a34a; }
.sn-btn-reset { background: transparent; border: 1px solid var(--border); color: var(--text); }
.sn-btn-reset:hover { background: var(--bg-card); }
.sn-dpad { display: none; grid-template-columns: repeat(3, 50px); grid-template-rows: repeat(2, 50px); gap: 6px; justify-content: center; }
.sn-dpad-btn { width: 50px; height: 50px; font-size: 1.5rem; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card); color: var(--text); cursor: pointer; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
.sn-dpad-btn:active { background: var(--border); }
.sn-dpad-empty { visibility: hidden; }
@media (max-width: 500px) { .sn-dpad { display: grid; } .sn-canvas { max-width: 320px; } }
.powered-by{text-align:center;padding:12px;margin-top:16px;font-size:.75rem;color:var(--text-secondary)}
.powered-by a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
<script src="/shared/bot-detect.js" defer></script>
<script src="/shared/analytics.js"></script>
</head><body class="embed-page">
<main class="tool-container">
<div class="tool-header">
    <h1>🐍 Snake Game</h1>
    <p>The classic snake game in your browser. Eat the red apple, grow longer — don't hit the walls! Perfect as a 404 page replacement.</p>
  </div>

  <div class="sn-container">
    <div class="sn-score">Score: <span id="snScore">0</span> &nbsp;|&nbsp; Best: <span id="snBest">0</span></div>
    <canvas class="sn-canvas" id="snCanvas" width="400" height="400"></canvas>
    <div class="sn-controls">
      <button class="sn-btn" id="snStart">▶ Start</button>
      <button class="sn-btn sn-btn-reset" id="snReset">↺ Reset</button>
    </div>
    <div class="sn-dpad" id="snDpad">
      <div class="sn-dpad-empty"></div>
      <button class="sn-dpad-btn" data-dir="up">▲</button>
      <div class="sn-dpad-empty"></div>
      <button class="sn-dpad-btn" data-dir="left">◀</button>
      <div class="sn-dpad-empty"></div>
      <button class="sn-dpad-btn" data-dir="right">▶</button>
      <div class="sn-dpad-empty"></div>
      <button class="sn-dpad-btn" data-dir="down">▼</button>
      <div class="sn-dpad-empty">
</main>
<div class="powered-by"><a href="https://toolstand.io/tools/snake-game/" target="_blank" rel="noopener">Powered by ToolStand Snake Game</a></div>
<script>
(function(){
  'use strict';
const cv = document.getElementById('snCanvas');
const ctx = cv.getContext('2d');
const GS = 20, CS = cv.width / GS;

let snake = [], food = { x:0, y:0 };
let dir = { x:1, y:0 }, nextDir = { x:1, y:0 };
let score = 0, best = parseInt(localStorage.getItem('sn-snake-best')||'0');
let running = false, interval = null, speed = 120;

function init() {
  snake = [{ x:10,y:10 }, { x:9,y:10 }, { x:8,y:10 }];
  dir = { x:1, y:0 }; nextDir = { x:1, y:0 };
  score = 0; speed = 120; placeFood(); updateScore(); draw();
}

function placeFood() {
  const occ = new Set(snake.map(s=>s.x*GS+s.y));
  let fx, fy;
  do { fx = Math.floor(Math.random()*GS); fy = Math.floor(Math.random()*GS); } while (occ.has(fx*GS+fy));
  food = { x:fx, y:fy };
}

function updateScore() {
  document.getElementById('snScore').textContent = score;
  document.getElementById('snBest').textContent = best;
}

function draw() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  ctx.fillStyle = isDark ? '#1e293b' : '#f8fafc';
  ctx.fillRect(0, 0, cv.width, cv.height);

  // Food
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.arc(food.x*CS+CS/2, food.y*CS+CS/2, CS/2-2, 0, Math.PI*2);
  ctx.fill();

  // Snake body
  snake.forEach((seg, i) => {
    const alpha = 1 - (i / snake.length) * 0.5;
    ctx.fillStyle = i === 0 ? '#22c55e' : `rgba(34,197,94,${alpha})`;
    ctx.fillRect(seg.x*CS+1, seg.y*CS+1, CS-2, CS-2);
  });

  // Eyes on head
  if (snake.length > 0) {
    const h = snake[0];
    const cx = h.x*CS+CS/2, cy = h.y*CS+CS/2;
    ctx.fillStyle = 'white';
    const ex = dir.x===0?4:(dir.x>0?4:-4);
    const ey = dir.y===0?4:(dir.y>0?4:-4);
    ctx.beginPath(); ctx.arc(cx+ex, cy+ey, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx-ex, cy-ey, 2.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1e293b';
    ctx.beginPath(); ctx.arc(cx+ex, cy+ey, 1.2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx-ex, cy-ey, 1.2, 0, Math.PI*2); ctx.fill();
  }
}

function tick() {
  if (!running) return;
  dir = { ...nextDir };
  const head = snake[0];
  const nh = { x: head.x+dir.x, y: head.y+dir.y };
  if (nh.x<0||nh.x>=GS||nh.y<0||nh.y>=GS) { end(); return; }
  if (snake.some(s=>s.x===nh.x && s.y===nh.y)) { end(); return; }

  snake.unshift(nh);
  if (nh.x===food.x && nh.y===food.y) {
    score += 10; updateScore(); placeFood();
    speed = Math.max(50, speed-3);
    clearInterval(interval); interval = setInterval(tick, speed);
  } else { snake.pop(); }
  draw();
}

function end() {
  running = false; clearInterval(interval); interval = null;
  if (score > best) { best = score; localStorage.setItem('sn-snake-best', best); }
  updateScore();
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.fillStyle = 'white';
  ctx.font = 'bold 24px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Game Over!', cv.width/2, cv.height/2-10);
  ctx.font = '16px -apple-system, BlinkMacSystemFont, sans-serif';
  ctx.fillText('Score: '+score, cv.width/2, cv.height/2+20);
  document.getElementById('snStart').textContent = '▶ Start';
}

function start() {
  if (running) return;
  init(); running = true;
  document.getElementById('snStart').textContent = '⏸ Running';
  interval = setInterval(tick, speed);
}

function setDir(dx, dy) {
  if (!running) return;
  if (dir.x===-dx && dir.y===-dy) return;
  nextDir = { x:dx, y:dy };
}

// Keyboard
document.addEventListener('keydown', e => {
  switch(e.key) {
    case 'ArrowUp': case 'w': case 'W': e.preventDefault(); setDir(0,-1); break;
    case 'ArrowDown': case 's': case 'S': e.preventDefault(); setDir(0,1); break;
    case 'ArrowLeft': case 'a': case 'A': e.preventDefault(); setDir(-1,0); break;
    case 'ArrowRight': case 'd': case 'D': e.preventDefault(); setDir(1,0); break;
  }
});

// Touch swipe
let tsX=0, tsY=0;
cv.addEventListener('touchstart', e => { tsX=e.touches[0].clientX; tsY=e.touches[0].clientY; });
cv.addEventListener('touchend', e => {
  const dx=e.changedTouches[0].clientX-tsX, dy=e.changedTouches[0].clientY-tsY;
  if (Math.abs(dx)<20 && Math.abs(dy)<20) return;
  if (Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1, 0);
  else setDir(0, dy>0?1:-1);
});

// D-pad
document.getElementById('snDpad').addEventListener('click', e => {
  const b = e.target.closest('.sn-dpad-btn');
  if (!b) return;
  const d = b.dataset.dir;
  if (d==='up') setDir(0,-1);
  if (d==='down') setDir(0,1);
  if (d==='left') setDir(-1,0);
  if (d==='right') setDir(1,0);
});

document.getElementById('snStart').addEventListener('click', start);
document.getElementById('snReset').addEventListener('click', () => {
  running = false; clearInterval(interval); interval = null;
  init(); draw(); document.getElementById('snStart').textContent = '▶ Start';
});

init(); updateScore(); draw();

const themeToggle = const savedTheme = localStorage.getItem('toolstand-theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
themeToggle?.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('toolstand-theme', next);
  draw();
});
  var s=localStorage.getItem('toolstand-theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
})();
</script>
</body></html>
