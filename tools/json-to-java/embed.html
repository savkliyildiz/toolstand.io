<style>

<script>
(function(){
  'use strict';
function toCamelCase(str) {
    return str.replace(/[^a-zA-Z0-9]/g, ' ').split(' ').filter(Boolean).map(function(w, i) {
      return i === 0 ? w.toLowerCase() : w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
    }).join('');
  }

  function toPascalCase(str) {
    var camel = toCamelCase(str);
    return camel.charAt(0).toUpperCase() + camel.slice(1);
  }

  function getJavaType(value, key) {
    if (value === null) return 'String';
    if (Array.isArray(value)) {
      if (value.length > 0) {
        var itemType = getJavaType(value[0], key);
        return 'List<' + itemType + '>';
      }
      return 'List<Object>';
    }
    if (typeof value === 'object') return toPascalCase(key || 'Inner');
    if (typeof value === 'boolean') return 'boolean';
    if (typeof value === 'number') {
      return Number.isInteger(value) ? 'int' : 'double';
    }
    return 'String';
  }

  function generateClass(obj, className, indent, useLombok, useJackson, useTabs, indentLevel) {
    var tab = useTabs ? '\t' : '  ';
    var indentStr = tab.repeat(indentLevel);
    var innerIndent = tab.repeat(indentLevel + 1);
    var lines = [];
    var innerClasses = [];

    lines.push(indentStr + 'public static class ' + className + ' {');

    if (useLombok) {
      lines.push(innerIndent + '@Data');
    }

    var fields = [];
    for (var key in obj) {
      if (!obj.hasOwnProperty(key)) continue;
      var val = obj[key];
      var javaType = getJavaType(val, key);
      var fieldName = toCamelCase(key);

      if (useJackson) {
        lines.push(innerIndent + '@JsonProperty("' + key + '")');
      }

      if (typeof val === 'object' && val !== null && !Array.isArray(val)) {
        var innerName = toPascalCase(key);
        fields.push({ type: innerName, name: fieldName, key: key });
        innerClasses.push({ name: innerName, obj: val });
      } else {
        fields.push({ type: javaType, name: fieldName, key: key });
      }
    }

    for (var i = 0; i < fields.length; i++) {
      lines.push(innerIndent + 'private ' + fields[i].type + ' ' + fields[i].name + ';');
    }

    if (!useLombok && document.getElementById('jtjGetters').checked) {
      lines.push('');
      for (var j = 0; j < fields.length; j++) {
        var getterName = 'get' + fields[j].name.charAt(0).toUpperCase() + fields[j].name.slice(1);
        var setterName = 'set' + fields[j].name.charAt(0).toUpperCase() + fields[j].name.slice(1);
        lines.push(innerIndent + 'public ' + fields[j].type + ' ' + getterName + '() {');
        lines.push(innerIndent + tab + 'return this.' + fields[j].name + ';');
        lines.push(innerIndent + '}');
        lines.push('');
        lines.push(innerIndent + 'public void ' + setterName + '(' + fields[j].type + ' ' + fields[j].name + ') {');
        lines.push(innerIndent + tab + 'this.' + fields[j].name + ' = ' + fields[j].name + ';');
        lines.push(innerIndent + '}');
      }
    }

    lines.push(indentStr + '}');

    for (var k = 0; k < innerClasses.length; k++) {
      lines.push('');
      lines = lines.concat(generateClass(innerClasses[k].obj, innerClasses[k].name, '', useLombok, useJackson, useTabs, indentLevel));
    }

    return lines;
  }

  document.getElementById('jtjGenerateBtn').addEventListener('click', function() {
    var input = document.getElementById('jtjInput').value.trim();
    var errorEl = document.getElementById('jtjError');
    var outputEl = document.getElementById('jtjOutput');
    var copyBtn = document.getElementById('jtjCopyBtn');
    errorEl.classList.remove('show');

    if (!input) {
      errorEl.textContent = '⚠️ Please paste some JSON first.';
      errorEl.classList.add('show');
      return;
    }

    try {
      var parsed = JSON.parse(input);
      var useLombok = document.getElementById('jtjLombok').checked;
      var useJackson = document.getElementById('jtjJackson').checked;
      var useTabs = document.getElementById('jtjTabs').checked;
      var tab = useTabs ? '\t' : '  ';

      var rootName;
      if (Array.isArray(parsed)) {
        rootName = 'RootItem';
        if (parsed.length > 0 && typeof parsed[0] === 'object' && parsed[0] !== null) {
          parsed = parsed[0];
          rootName = 'RootItem';
        }
      }

      if (typeof parsed !== 'object' || parsed === null) {
        errorEl.textContent = '⚠️ JSON must be an object or array of objects.';
        errorEl.classList.add('show');
        return;
      }

      rootName = rootName || 'Root';
      if (parsed._className) {
        rootName = parsed._className;
      }

      var lines = [];
      if (useLombok) {
        lines.push('import lombok.Data;');
      }
      if (useJackson) {
        lines.push('import com.fasterxml.jackson.annotation.JsonProperty;');
      }
      if (Array.isArray(parsed) || hasListField(parsed)) {
        lines.push('import java.util.List;');
      }
      if (lines.length > 0) lines.push('');

      lines = lines.concat(generateClass(parsed, rootName, '', useLombok, useJackson, useTabs, 0));

      outputEl.value = lines.join('\n');
      copyBtn.style.display = '';
      window._jtjLastOutput = outputEl.value;
    } catch (e) {
      errorEl.innerHTML = '<strong>❌ Invalid JSON</strong><br>' + e.message;
      errorEl.classList.add('show');
    }
  });

  function hasListField(obj) {
    for (var key in obj) {
      if (!obj.hasOwnProperty(key)) continue;
      if (Array.isArray(obj[key])) return true;
      if (typeof obj[key] === 'object' && obj[key] !== null && hasListField(obj[key])) return true;
    }
    return false;
  }

  document.getElementById('jtjCopyBtn').addEventListener('click', function() {
    var output = window._jtjLastOutput || document.getElementById('jtjOutput').value;
    if (!output) return;
    navigator.clipboard.writeText(output).then(function() {
      var btn = document.getElementById('jtjCopyBtn');
      btn.textContent = '✅ Copied!';
      setTimeout(function() { btn.textContent = '📋 Copy Code'; }, 1500);
    });
  });

  document.getElementById('jtjClearBtn').addEventListener('click', function() {
    document.getElementById('jtjInput').value = '';
    document.getElementById('jtjOutput').value = '';
    document.getElementById('jtjCopyBtn').style.display = 'none';
    document.getElementById('jtjError').classList.remove('show');
    window._jtjLastOutput = '';
  });
  var s=localStorage.getItem('toolstand-theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
})();
</script>
