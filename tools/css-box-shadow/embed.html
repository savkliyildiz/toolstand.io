<style>
.header,.footer,.embed-cta,#embed-section,.ad-banner{display:none}
.bsh-container { display: flex; flex-direction: column; gap: 20px; }
.bsh-preview-wrapper { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 40px 20px; display: flex; align-items: center; justify-content: center; min-height: 200px; }

.bsh-control label span { color: var(--text-secondary); font-weight: 400; }
.bsh-control input[type="range"] { width: 100%; accent-color: #8b5cf6; }
.bsh-color-row { display: flex; gap: 10px; align-items: center; }
.bsh-color-row input[type="color"] { width: 44px; height: 36px; border: 2px solid var(--border); border-radius: 6px; padding: 2px; cursor: pointer; background: none; }
.bsh-color-row span { font-size: 0.85rem; color: var(--text-secondary); }
.bsh-inset-toggle { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.bsh-inset-toggle label { font-size: 0.85rem; color: var(--text); cursor: pointer; }
.bsh-output { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 0.85rem; color: var(--text); word-break: break-all; cursor: pointer; position: relative; }
.bsh-output:hover { border-color: #8b5cf6; }
.bsh-copy-btn { padding: 10px 22px; background: #8b5cf6; color: white; border: none; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; cursor: pointer; align-self: flex-start; transition: opacity 0.15s; }

<main class="tool-container">
<div class="tool-header">
    <h1>🎨 CSS Box Shadow Generator — Visual Shadow Designer</h1>
    <p>Design CSS box shadows visually. Adjust offset, blur, spread, and color with live preview. Free, no signup.</p>
  </div>

  <div class="bsh-container">
    <div class="bsh-preview-wrapper">
      <div class="bsh-preview-box" id="bshPreviewBox"></div>
    </div>

    <div class="bsh-controls">
      <div class="bsh-control">
        <label>X-Offset <span id="bshXVal">0px</span></label>
        <input type="range" id="bshX" min="-50" max="50" value="10">
      </div>
      <div class="bsh-control">
        <label>Y-Offset <span id="bshYVal">10px</span></label>
        <input type="range" id="bshY" min="-50" max="50" value="10">
      </div>
      <div class="bsh-control">
        <label>Blur <span id="bshBlurVal">20px</span></label>
        <input type="range" id="bshBlur" min="0" max="100" value="20">
      </div>
      <div class="bsh-control">
        <label>Spread <span id="bshSpreadVal">0px</span></label>
        <input type="range" id="bshSpread" min="-30" max="30" value="0">
      </div>
    </div>

    <div class="bsh-color-row">
      <input type="color" id="bshColor" value="#000000">
      <span id="bshColorHex">#000000</span>
      <span style="margin-left:8px">Opacity:</span>
      <input type="range" id="bshOpacity" min="0" max="100" value="25" style="width:100px;accent-color:#8b5cf6;">
      <span id="bshOpacityVal">25%</span>
    </div>

    <div class="bsh-inset-toggle">
      <input type="checkbox" id="bshInset">
      <label for="bshInset">Inset shadow (inner shadow)</label>
    </div>

    <div class="bsh-output" id="bshOutput" title="Click to copy CSS"></div>
    <button class="bsh-copy-btn" id="bshCopyBtn">📋 Copy CSS</button>
  </div>

    

  <section class="seo-content">
</main>

<script>
(function(){
  'use strict';
function hexToRgba(hex, alpha) {
    hex = hex.replace('#', '');
    var r = parseInt(hex.substring(0, 2), 16);
    var g = parseInt(hex.substring(2, 4), 16);
    var b = parseInt(hex.substring(4, 6), 16);
    return 'rgba(' + r + ', ' + g + ', ' + b + ', ' + alpha + ')';
  }

  function update() {
    var x = document.getElementById('bshX').value;
    var y = document.getElementById('bshY').value;
    var blur = document.getElementById('bshBlur').value;
    var spread = document.getElementById('bshSpread').value;
    var color = document.getElementById('bshColor').value;
    var opacity = document.getElementById('bshOpacity').value / 100;
    var inset = document.getElementById('bshInset').checked ? 'inset ' : '';
    var rgba = hexToRgba(color, opacity);

    document.getElementById('bshXVal').textContent = x + 'px';
    document.getElementById('bshYVal').textContent = y + 'px';
    document.getElementById('bshBlurVal').textContent = blur + 'px';
    document.getElementById('bshSpreadVal').textContent = spread + 'px';
    document.getElementById('bshColorHex').textContent = color;
    document.getElementById('bshOpacityVal').textContent = Math.round(opacity * 100) + '%';

    var css = inset + x + 'px ' + y + 'px ' + blur + 'px ' + spread + 'px ' + rgba;
    document.getElementById('bshPreviewBox').style.boxShadow = css;
    document.getElementById('bshOutput').textContent = 'box-shadow: ' + css + ';';
  }

  ['bshX', 'bshY', 'bshBlur', 'bshSpread', 'bshColor', 'bshOpacity', 'bshInset'].forEach(function(id) {
    var el = document.getElementById(id);
    el.addEventListener('input', update);
    el.addEventListener('change', update);
  });

  document.getElementById('bshCopyBtn').addEventListener('click', function() {
    var text = document.getElementById('bshOutput').textContent;
    navigator.clipboard.writeText(text).then(function() {
      var btn = document.getElementById('bshCopyBtn');
      btn.textContent = '✅ Copied!';
      setTimeout(function() { btn.textContent = '📋 Copy CSS'; }, 1500);
    });
  });

  document.getElementById('bshOutput').addEventListener('click', function() {
    var text = this.textContent;
    navigator.clipboard.writeText(text).then(function() {
      var out = document.getElementById('bshOutput');
      out.style.background = 'rgba(139, 92, 246, 0.15)';
      setTimeout(function() { out.style.background = ''; }, 400);
    });
  });

  update();
  var s=localStorage.getItem('toolstand-theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
})();
</script>
</body></html>
