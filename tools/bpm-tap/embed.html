<script>
(function(){
  'use strict';
'use strict';

    // Theme
    document.documentElement.setAttribute('data-theme', t);
        localStorage.setItem('toolstand-theme', t);
    });

    // Service Worker
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js');
    }

    // BPM state
    var taps = [];
    var resetTimer = null;
    var bpmDisplay = document.getElementById('bpmDisplay');
    var tapCountEl = document.getElementById('tapCount');
    var avgBpmEl = document.getElementById('avgBpm');
    var beatIndicator = document.getElementById('beatIndicator');
    var tapButton = document.getElementById('tapButton');

    function resetTaps() {
        taps = [];
        bpmDisplay.textContent = '--';
        tapCountEl.textContent = '0';
        avgBpmEl.textContent = '--';
        if (resetTimer) {
            clearTimeout(resetTimer);
            resetTimer = null;
        }
    }

    function pulseBeat() {
        beatIndicator.classList.add('pulse');
        setTimeout(function() {
            beatIndicator.classList.remove('pulse');
        }, 80);
    }

    function calculateBpm() {
        if (taps.length < 2) {
            bpmDisplay.textContent = '--';
            avgBpmEl.textContent = '--';
            return;
        }

        // Use last 8 taps
        var recentTaps = taps.slice(-8);
        var intervals = [];
        for (var i = 1; i < recentTaps.length; i++) {
            intervals.push(recentTaps[i] - recentTaps[i - 1]);
        }

        // Calculate average interval
        var sum = 0;
        for (var i = 0; i < intervals.length; i++) {
            sum += intervals[i];
        }
        var avgInterval = sum / intervals.length;

        if (avgInterval <= 0) return;

        var bpm = Math.round(60000 / avgInterval);

        // Clamp to reasonable range
        if (bpm < 20) bpm = 20;
        if (bpm > 300) bpm = 300;

        bpmDisplay.textContent = bpm;
        avgBpmEl.textContent = bpm;
        pulseBeat();
    }

    function doTap() {
        var now = Date.now();
        taps.push(now);
        tapCountEl.textContent = taps.length;
        calculateBpm();

        // Visual feedback
        tapButton.classList.add('tapping');
        setTimeout(function() {
            tapButton.classList.remove('tapping');
        }, 100);

        // Reset after 4 seconds of inactivity
        if (resetTimer) clearTimeout(resetTimer);
        resetTimer = setTimeout(resetTaps, 4000);
    }

    // Button tap
    tapButton.addEventListener('click', function(e) {
        e.preventDefault();
        doTap();
    });

    // Spacebar tap
    document.addEventListener('keydown', function(e) {
        if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32) {
            e.preventDefault();
            doTap();
        }
    });

    // Reset button
    document.getElementById('resetButton').addEventListener('click', function() {
        resetTaps();
    });
  var s=localStorage.getItem('toolstand-theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
})();
</script>
