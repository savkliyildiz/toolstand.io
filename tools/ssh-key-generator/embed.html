    // Helper: ArrayBuffer to Base64 with 64-char lines
    function arrayBufferToPemBase64(buffer) {
        var bytes = new Uint8Array(buffer);
        var binary = '';
        for (var i = 0; i < bytes.byteLength; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        var b64 = btoa(binary);
        var lines = [];
        for (var i = 0; i < b64.length; i += 64) {
            lines.push(b64.substring(i, i + 64));
        }
        return lines.join('\n');
    }

    function pemPublic(b64) {
        return '-----BEGIN PUBLIC KEY-----\n' + b64 + '\n-----END PUBLIC KEY-----';
    }

    function pemPrivate(b64) {
        return '-----BEGIN PRIVATE KEY-----\n' + b64 + '\n-----END PRIVATE KEY-----';
    }

    function isRSA(type) {
        return type === 'RSA-2048' || type === 'RSA-4096';
    }

    // Generate
    document.getElementById('generateBtn').addEventListener('click', function() {
        var keyType = document.getElementById('keyType').value;
        var btn = document.getElementById('generateBtn');
        var spinner = document.getElementById('spinner');

        btn.disabled = true;
        document.body.classList.add('loading');
        spinner.style.display = 'inline-block';

        document.getElementById('publicKeySection').style.display = 'none';
        document.getElementById('privateKeySection').style.display = 'none';

        var algorithm;
        if (isRSA(keyType)) {
            var modulusLength = keyType === 'RSA-2048' ? 2048 : 4096;
            algorithm = {
                name: 'RSA-OAEP',
                modulusLength: modulusLength,
                publicExponent: new Uint8Array([0x01, 0x00, 0x01]),
                hash: 'SHA-256'
            };
        } else {
            var namedCurve = keyType === 'ECDSA-P256' ? 'P-256' : 'P-384';
            algorithm = {
                name: 'ECDSA',
                namedCurve: namedCurve
            };
        }

        var extractable = true;
        var usages = isRSA(keyType) ? ['encrypt', 'decrypt'] : ['sign', 'verify'];

        crypto.subtle.generateKey(algorithm, extractable, usages).then(function(keyPair) {
            var exports = [];
            exports.push(crypto.subtle.exportKey('spki', keyPair.publicKey));
            exports.push(crypto.subtle.exportKey('pkcs8', keyPair.privateKey));
            return Promise.all(exports);
        }).then(function(results) {
            var pubB64 = arrayBufferToPemBase64(results[0]);
            var privB64 = arrayBufferToPemBase64(results[1]);

            document.getElementById('publicKey').value = pemPublic(pubB64);
            document.getElementById('privateKey').value = pemPrivate(privB64);

            document.getElementById('publicKeySection').style.display = 'block';
            document.getElementById('privateKeySection').style.display = 'block';
        }).catch(function(err) {
            alert('Key generation failed: ' + err.message);
        }).finally(function() {
            btn.disabled = false;
            spinner.style.display = 'none';
            document.body.classList.remove('loading');
        });
    });

    // Copy buttons
    function setupCopy(btnId, textareaId) {
        document.getElementById(btnId).addEventListener('click', function() {
            var ta = document.getElementById(textareaId);
            ta.select();
            document.execCommand('copy');
            var btn = document.getElementById(btnId);
            btn.textContent = '✅ Copied!';
            setTimeout(function() { btn.textContent = '📋 Copy'; }, 2000);
        });
    }
    setupCopy('copyPublicBtn', 'publicKey');
