<style>
.header,.footer,.embed-cta,#embed-section,.ad-banner{display:none}
.rn-mode-tabs { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }
.rn-mode-tab { flex: 1; padding: 11px 14px; border: none; cursor: pointer; font-size: 0.88rem; font-weight: 600; background: var(--bg-card); color: var(--text-secondary); transition: all 0.15s; white-space: nowrap; }
.rn-mode-tab.rn-active { background: #8b5cf6; color: white; }
.rn-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 16px; }
.rn-input-group { display: flex; flex-direction: column; gap: 5px; }
.rn-input-group label { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
.rn-input-group input, .rn-input-group select { padding: 11px 14px; border: 2px solid var(--border); border-radius: var(--radius); font-size: 1rem; background: var(--bg); color: var(--text); transition: border-color 0.15s; }
.rn-input-group input:focus, .rn-input-group select:focus { outline: none; border-color: #8b5cf6; }
.rn-input-group input[type="checkbox"] { width: 18px; height: 18px; margin: 0; }
.rn-checkbox { display: flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); padding-top: 8px; }
.rn-display { background: var(--bg-card); border: 2px solid var(--border); border-radius: var(--radius); padding: 40px 20px; text-align: center; margin-bottom: 16px; min-height: 80px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 8px; }
.rn-display-value { font-size: 4rem; font-weight: 900; letter-spacing: -0.03em; color: #8b5cf6; line-height: 1.1; word-break: break-all; }
.rn-display-value.rn-multi { font-size: 2rem; }
.rn-display-label { font-size: 0.8rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.05em; }
.rn-btn-generate { display: block; width: 100%; max-width: 300px; margin: 0 auto 20px; padding: 14px 20px; font-size: 1.1rem; font-weight: 700; background: #8b5cf6; color: white; border: none; border-radius: var(--radius); cursor: pointer; transition: background 0.15s; }
.rn-btn-generate:hover { background: #7c3aed; }
.rn-btn-generate:active { transform: scale(0.98); }
.rn-history { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
.rn-history h3 { font-size: 0.9rem; font-weight: 700; margin: 0 0 10px 0; display: flex; justify-content: space-between; align-items: center; }
.rn-history-list { display: flex; flex-direction: column; gap: 6px; max-height: 280px; overflow-y: auto; }
.rn-history-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.88rem; }
.rn-history-value { font-weight: 700; color: #8b5cf6; }
.rn-history-type { font-size: 0.72rem; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }
.rn-btn-clear { font-size: 0.75rem; color: var(--text-secondary); background: none; border: 1px solid var(--border); border-radius: var(--radius); padding: 4px 12px; cursor: pointer; }
.rn-btn-clear:hover { background: var(--bg); }
.rn-stats { font-size: 0.75rem; color: var(--text-secondary); margin-top: 8px; text-align: center; }
@media (max-width: 640px) {
  .rn-mode-tabs { flex-wrap: wrap; }
  .rn-mode-tab { flex: 1 1 45%; font-size: 0.78rem; padding: 10px 8px; }
  .rn-display-value { font-size: 2.8rem; }
  .rn-display-value.rn-multi { font-size: 1.5rem; }
}
.powered-by{text-align:center;padding:12px;margin-top:16px;font-size:.75rem;color:var(--text-secondary)}
.powered-by a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
<script src="/shared/bot-detect.js" defer></script>

</head><body class="embed-page">
<main class="tool-container">
<div class="tool-header">
    <h1>🎲 Random Number Generator</h1>
    <p>Cryptographically secure random numbers. Dice rolls, lottery picks, unique draws — free, instant, no signup.</p>
  </div>

  <div class="rn-mode-tabs" id="rnTabs">
    <button class="rn-mode-tab rn-active" data-mode="single">🔢 Single</button>
    <button class="rn-mode-tab" data-mode="multiple">📋 Multiple</button>
    <button class="rn-mode-tab" data-mode="dice">🎲 Dice</button>
    <button class="rn-mode-tab" data-mode="lottery">🎰 Lottery</button>
  </div>

  <div class="rn-inputs" id="rnSingleInputs">
    <div class="rn-input-group"><label for="rnMin">Min</label><input type="number" id="rnMin" value="1" step="1"></div>
    <div class="rn-input-group"><label for="rnMax">Max</label><input type="number" id="rnMax" value="100" step="1"></div>
  </div>

  <div class="rn-inputs" id="rnMultipleInputs" style="display:none">
    <div class="rn-input-group"><label for="rnCount">Count</label><input type="number" id="rnCount" value="5" min="1" max="1000" step="1"></div>
    <div class="rn-input-group"><label for="rnMin2">Min</label><input type="number" id="rnMin2" value="1" step="1"></div>
    <div class="rn-input-group"><label for="rnMax2">Max</label><input type="number" id="rnMax2" value="100" step="1"></div>
    <div class="rn-checkbox"><input type="checkbox" id="rnUnique"><label for="rnUnique" style="margin:0;cursor:pointer">Unique numbers only</label></div>
  </div>

  <div class="rn-inputs" id="rnDiceInputs" style="display:none">
    <div class="rn-input-group"><label for="rnDiceCount">Number of Dice</label><input type="number" id="rnDiceCount" value="2" min="1" max="100" step="1"></div>
    <div class="rn-input-group"><label for="rnDiceSides">Sides</label><select id="rnDiceSides"><option value="6">d6</option><option value="4">d4</option><option value="8">d8</option><option value="10">d10</option><option value="12">d12</option><option value="20" selected>d20</option><option value="100">d100</option></select></div>
  </div>

  <div class="rn-inputs" id="rnLotteryInputs" style="display:none">
    <div class="rn-input-group"><label for="rnLotteryPick">Numbers to Pick</label><input type="number" id="rnLotteryPick" value="6" min="1" max="100" step="1"></div>
    <div class="rn-input-group"><label for="rnLotteryFrom">From Pool of</label><input type="number" id="rnLotteryFrom" value="49" min="2" max="1000" step="1"></div>
  </div>

  <div class="rn-display" id="rnDisplay">
    <div class="rn-display-label">Result</div>
    <div class="rn-display-value" id="rnDisplayValue">—</div>
  </div>

  <button class="rn-btn-generate" id="rnGenerateBtn">🎲 Generate</button>

  <div class="rn-history" id="rnHistory">
    <h3>📜 History <button class="rn-btn-clear" id="rnClearHistory">Clear</button></h3>
    <div class="rn-history-list" id="rnHistoryList">
      <div style="text-align:center;color:var(--text-secondary);padding:12px">No generations yet
</main>
<div class="powered-by"><a href="https://toolstand.io/tools/random-number/" target="_blank" rel="noopener">Powered by ToolStand Random Number Generator</a></div>
<script>
(function(){
  'use strict';
var el = function(id) { return document.getElementById(id); };
  var currentMode = 'single';
  var history = [];

  function getSecureRandom(max) {
    var arr = new Uint32Array(1);
    crypto.getRandomValues(arr);
    return arr[0] / (0xFFFFFFFF + 1) * max;
  }

  function getSecureInt(min, max) {
    if (min > max) { var tmp = min; min = max; max = tmp; }
    var range = max - min + 1;
    var maxRand = 0xFFFFFFFF - (0xFFFFFFFF % range);
    var arr = new Uint32Array(1);
    do { crypto.getRandomValues(arr); } while (arr[0] >= maxRand);
    return min + (arr[0] % range);
  }

  function generate() {
    var result = '', type = '';
    if (currentMode === 'single') {
      var min = parseInt(el('rnMin').value) || 1;
      var max = parseInt(el('rnMax').value) || 100;
      var val = getSecureInt(min, max);
      result = val.toString();
      type = 'Single (' + min + '–' + max + ')';
      el('rnDisplayValue').className = 'rn-display-value';
    } else if (currentMode === 'multiple') {
      var count = parseInt(el('rnCount').value) || 5;
      var min2 = parseInt(el('rnMin2').value) || 1;
      var max2 = parseInt(el('rnMax2').value) || 100;
      var unique = el('rnUnique').checked;
      var numbers = [];
      if (unique && (max2 - min2 + 1) < count) {
        result = '⚠️ Range too small for ' + count + ' unique numbers';
        type = 'Multiple (error)';
      } else {
        var pool = [];
        if (unique) {
          for (var i = min2; i <= max2; i++) pool.push(i);
          for (var j = pool.length - 1; j > 0; j--) {
            var k = getSecureInt(0, j);
            var tmp2 = pool[j]; pool[j] = pool[k]; pool[k] = tmp2;
          }
          numbers = pool.slice(0, count);
        } else {
          for (var n = 0; n < count; n++) numbers.push(getSecureInt(min2, max2));
        }
        result = numbers.join(', ');
        type = 'Multiple (' + count + '× ' + min2 + '–' + max2 + (unique ? ', unique' : '') + ')';
      }
      el('rnDisplayValue').className = 'rn-display-value rn-multi';
    } else if (currentMode === 'dice') {
      var dc = parseInt(el('rnDiceCount').value) || 2;
      var ds = parseInt(el('rnDiceSides').value) || 20;
      var rolls = [];
      var total = 0;
      for (var r = 0; r < dc; r++) {
        var roll = getSecureInt(1, ds);
        rolls.push(roll);
        total += roll;
      }
      result = total.toString();
      if (dc > 1) result += '  [' + rolls.join(', ') + ']';
      type = dc + 'd' + ds;
      el('rnDisplayValue').className = 'rn-display-value';
    } else if (currentMode === 'lottery') {
      var pick = parseInt(el('rnLotteryPick').value) || 6;
      var from = parseInt(el('rnLotteryFrom').value) || 49;
      if (pick > from) {
        result = '⚠️ Pick must be ≤ pool size';
        type = 'Lottery (error)';
      } else {
        var pool2 = [];
        for (var p = 1; p <= from; p++) pool2.push(p);
        for (var s = pool2.length - 1; s > 0; s--) {
          var k2 = getSecureInt(0, s);
          var tmp3 = pool2[s]; pool2[s] = pool2[k2]; pool2[k2] = tmp3;
        }
        var drawn = pool2.slice(0, pick).sort(function(a, b) { return a - b; });
        result = drawn.join(', ');
        type = 'Lottery (' + pick + '/' + from + ')';
      }
      el('rnDisplayValue').className = 'rn-display-value rn-multi';
    }

    el('rnDisplayValue').textContent = result;
    history.unshift({ value: result, type: type, time: new Date().toLocaleTimeString() });
    if (history.length > 10) history = history.slice(0, 10);
    renderHistory();
  }

  function renderHistory() {
    var list = el('rnHistoryList');
    if (history.length === 0) {
      list.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:12px">No generations yet</div>';
      return;
    }
    var html = '';
    for (var i = 0; i < history.length; i++) {
      html += '<div class="rn-history-item"><span class="rn-history-value">' + history[i].value + '</span><span class="rn-history-type">' + history[i].type + ' · ' + history[i].time + '</span></div>';
    }
    list.innerHTML = html;
  }

  function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.rn-mode-tab').forEach(function(t) { t.classList.remove('rn-active'); });
    document.querySelector('.rn-mode-tab[data-mode="' + mode + '"]').classList.add('rn-active');
    el('rnSingleInputs').style.display = mode === 'single' ? 'grid' : 'none';
    el('rnMultipleInputs').style.display = mode === 'multiple' ? 'grid' : 'none';
    el('rnDiceInputs').style.display = mode === 'dice' ? 'grid' : 'none';
    el('rnLotteryInputs').style.display = mode === 'lottery' ? 'grid' : 'none';
  }

  el('rnTabs').addEventListener('click', function(e) {
    if (e.target.tagName !== 'BUTTON' || !e.target.dataset.mode) return;
    switchMode(e.target.dataset.mode);
  });

  el('rnGenerateBtn').addEventListener('click', generate);
  el('rnClearHistory').addEventListener('click', function() {
    history = [];
    renderHistory();
  });

  generate();

  var themeToggle = themeToggle.addEventListener('click', function() {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('toolstand-theme', next);
  });
  var s=localStorage.getItem('toolstand-theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
})();
</script>
</body></html>
