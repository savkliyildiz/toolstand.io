<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCA Calculator — Embed</title>

<script type="application/ld+json">{"@context":"https://schema.org","@type":["WebApplication","SoftwareApplication"],"name":"DCA Calculator","url":"https://toolstand.io/tools/dca-calculator/","applicationCategory":"CalculatorApplication","operatingSystem":"All","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"isAccessibleForFree":true}</script>
<style>
.header,.footer,.embed-cta,#embed-section,.ad-banner{display:none}
.dc-container{display:flex;flex-direction:column;gap:20px}.dc-add{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.dc-group{display:flex;flex-direction:column;gap:5px}.dc-group label{font-size:.85rem;font-weight:600;color:var(--text-secondary)}.dc-group input{padding:11px 14px;border:2px solid var(--border);border-radius:var(--radius);font-size:1rem;background:var(--bg);color:var(--text)}.dc-group input:focus{outline:none;border-color:#3b82f6}.dc-btn{padding:11px 24px;font-weight:700;border:none;border-radius:var(--radius);cursor:pointer;font-size:.95rem;white-space:nowrap}.dc-btn-add{background:#3b82f6;color:white}.dc-btn-add:hover{background:#2563eb}.dc-btn-reset{background:transparent;border:1px solid var(--border);color:var(--text)}.dc-list{display:flex;flex-direction:column;gap:6px;max-height:200px;overflow-y:auto}.dc-item{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;padding:10px 12px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);font-size:.85rem;align-items:center}.dc-remove{background:#ef4444;color:white;border:none;border-radius:100px;width:24px;height:24px;cursor:pointer;font-weight:700}.dc-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.dc-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}.dc-card-label{font-size:.78rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase}.dc-card-value{font-size:1.5rem;font-weight:800}.dc-blue{color:#3b82f6}.dc-green{color:#22c55e}.dc-red{color:#ef4444}.dc-chart-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px}.dc-chart-wrap canvas{max-height:300px}@media(max-width:600px){.dc-add{grid-template-columns:1fr 1fr}.dc-item{grid-template-columns:1fr 1fr 1fr auto;font-size:.75rem}}
.powered-by{text-align:center;padding:12px;margin-top:16px;font-size:.75rem;color:var(--text-secondary)}
.powered-by a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
<script src="/shared/bot-detect.js" defer></script>
<script src="/shared/analytics.js"></script>
</head><body class="embed-page">
<main class="tool-container">
<div class="tool-header"><h1>📉 DCA Calculator</h1><p>Dollar Cost Averaging: add multiple buys at different prices and see your real average cost. Free, instant, visual.</p></div><div class="dc-container">
<div class="dc-add"><div class="dc-group"><label>Price ($)</label><input type="number" id="dcPrice" placeholder="100" step="0.01" min="0"></div><div class="dc-group"><label>Quantity</label><input type="number" id="dcQty" placeholder="10" step="0.01" min="0"></div><button class="dc-btn dc-btn-add" id="dcAdd">+ Add Buy</button></div>
<div class="dc-list" id="dcList"></div>
<div style="display:flex;gap:8px"><button class="dc-btn dc-btn-reset" id="dcReset">↺ Reset</button><button class="dc-btn dc-btn-reset" id="dcExample">📋 Load Example</button></div>
<div class="dc-results" id="dcResults"><div class="dc-card"><div class="dc-card-label">Total Invested</div><div class="dc-card-value dc-blue" id="dcTotal">$0</div></div><div class="dc-card"><div class="dc-card-label">Total Quantity</div><div class="dc-card-value dc-blue" id="dcQtyTotal">0</div></div><div class="dc-card"><div class="dc-card-label">Avg Cost</div><div class="dc-card-value dc-green" id="dcAvg">$0</div></div><div class="dc-card"><div class="dc-card-label">P/L at Market</div><div class="dc-card-value dc-red" id="dcPL">$0</div></div></div>
<div class="dc-chart-wrap"><canvas id="dcChart"></canvas>
</main>
<div class="powered-by"><a href="https://toolstand.io/tools/dca-calculator/" target="_blank" rel="noopener">Powered by ToolStand DCA Calculator</a></div>
<script>
(function(){
  'use strict';
var buys=[],chart=null;
function render(){var el=document.getElementById('dcList');el.innerHTML=buys.length===0?'<p style="color:var(--text-secondary);font-size:.85rem;text-align:center">No buys yet. Add your first purchase above.</p>':buys.map(function(b,i){return'<div class="dc-item"><span>💰 $'+b.price.toFixed(2)+'</span><span>📦 '+b.qty+'</span><span>💵 $'+(b.price*b.qty).toFixed(2)+'</span><button class="dc-remove" data-idx="'+i+'">✕</button></div>';}).join('');
var totalCost=buys.reduce(function(s,b){return s+b.price*b.qty},0),totalQty=buys.reduce(function(s,b){return s+b.qty},0),avg=totalQty>0?totalCost/totalQty:0;
document.getElementById('dcTotal').textContent='$'+totalCost.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
document.getElementById('dcQtyTotal').textContent=totalQty.toLocaleString('en-US',{minimumFractionDigits:4,maximumFractionDigits:4});
document.getElementById('dcAvg').textContent='$'+avg.toLocaleString('en-US',{minimumFractionDigits:4,maximumFractionDigits:4});
var mktPrice=parseFloat(document.getElementById('dcPrice').value)||avg;var pl=(mktPrice-avg)*totalQty;
document.getElementById('dcPL').textContent='$'+pl.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
document.getElementById('dcPL').style.color=pl>=0?'#22c55e':'#ef4444';
updateChart(avg,totalQty);}
function updateChart(avg,totalQty){var ctx=document.getElementById('dcChart').getContext('2d');if(chart)chart.destroy();if(buys.length===0)return;
var sorted=buys.slice().sort(function(a,b){return a.price-b.price}),prices=sorted.map(function(b){return b.price}),qtys=sorted.map(function(b){return b.qty});
var isDark=document.documentElement.getAttribute('data-theme')==='dark',gc=isDark?'rgba(148,163,184,0.15)':'rgba(100,116,139,0.15)',tc=isDark?'#94a3b8':'#64748b';
chart=new Chart(ctx,{type:'bar',data:{labels:prices.map(function(p){return'$'+p.toFixed(2)}),datasets:[{label:'Quantity',data:qtys,backgroundColor:qtys.map(function(q,i){return prices[i]<avg?'rgba(34,197,94,0.7)':'rgba(239,68,68,0.7)'}),borderRadius:4}]},
options:{responsive:true,maintainAspectRatio:true,plugins:{legend:{display:false},annotation:{annotations:{avgLine:{type:'line',xMin:avg,xMax:avg,borderColor:'#3b82f6',borderWidth:2,borderDash:[6,4],label:{content:'Avg: $'+avg.toFixed(2),enabled:true}}}}},
scales:{x:{grid:{color:gc},ticks:{color:tc}},y:{grid:{color:gc},ticks:{color:tc}}}}})}
function add(){var p=parseFloat(document.getElementById('dcPrice').value),q=parseFloat(document.getElementById('dcQty').value);if(!p||!q||p<=0||q<=0)return;buys.push({price:p,qty:q});render();}
document.getElementById('dcAdd').addEventListener('click',add);
document.getElementById('dcReset').addEventListener('click',function(){buys=[];render();});
document.getElementById('dcExample').addEventListener('click',function(){buys=[{price:100,qty:5},{price:90,qty:10},{price:80,qty:15},{price:95,qty:8},{price:85,qty:12}];document.getElementById('dcPrice').value=75;render();});
document.getElementById('dcList').addEventListener('click',function(e){if(e.target.classList.contains('dc-remove')){buys.splice(parseInt(e.target.dataset.idx),1);render();}});
document.documentElement.setAttribute('data-theme',n);localStorage.setItem('toolstand-theme',n);if(chart)render();});
render();
  var s=localStorage.getItem('toolstand-theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
})();
</script>
</body></html>
