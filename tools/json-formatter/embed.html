<script>
(function(){
  'use strict';
var inp=document.getElementById('jsInput'),out=document.getElementById('jsOutput'),err=document.getElementById('jsError'),ok=document.getElementById('jsSuccess');

function syntaxHighlight(json){json=json.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');return json.replace(/("(\\u[a-fA-F0-9]{4}|\\[^u]|[^"\\])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,function(m){var cls='number';if(/^"/.test(m)){cls=/:$/.test(m)?'key':'string'}else if(/true|false/.test(m)){cls='boolean'}else if(/null/.test(m)){cls='null'}return'<span class="'+cls+'">'+m+'</span>';});}

function format(minify){var txt=inp.value.trim();if(!txt){err.classList.remove('show');ok.classList.remove('show');out.style.display='none';return}
try{var obj=JSON.parse(txt);var result=minify?JSON.stringify(obj):JSON.stringify(obj,null,2);err.classList.remove('show');ok.textContent='✅ Valid JSON — '+result.split('\n').length+' lines, '+result.length+' chars';ok.classList.add('show');out.innerHTML=syntaxHighlight(result);out.style.display='block';window._lastOutput=result}
catch(e){ok.classList.remove('show');var msg=e.message,line='',pos='';var m=msg.match(/position\s+(\d+)/);if(m){pos=parseInt(m[1]);var lines=txt.substring(0,pos).split('\n');line=(lines.length);err.innerHTML='<strong>❌ Invalid JSON at line '+line+', position '+(pos-(txt.substring(0,pos).lastIndexOf('\n')+1)+1)+'</strong><pre>'+msg+'</pre>'}else{err.innerHTML='<strong>❌ Invalid JSON</strong><pre>'+msg+'</pre>'}err.classList.add('show');out.style.display='none'}}

document.getElementById('jsFormat').addEventListener('click',function(){format(false);});
document.getElementById('jsMinify').addEventListener('click',function(){format(true);});
document.getElementById('jsCopy').addEventListener('click',function(){if(window._lastOutput)navigator.clipboard.writeText(window._lastOutput);var b=document.getElementById('jsCopy');b.textContent='✅ Copied!';setTimeout(function(){b.textContent='📋 Copy'},1500);});
