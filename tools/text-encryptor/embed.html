    // Helpers
    function arrayBufferToBase64(buffer) {
        var bytes = new Uint8Array(buffer);
        var binary = '';
        for (var i = 0; i < bytes.byteLength; i++) {
            binary += String.fromCharCode(bytes[i]);
        }
        return btoa(binary);
    }

    function base64ToArrayBuffer(base64) {
        var binary = atob(base64);
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
        }
        return bytes.buffer;
    }

    function getKeyMaterial(password) {
        var enc = new TextEncoder();
        return crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    }

    function deriveKey(keyMaterial, salt) {
        return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: salt, iterations: 100000, hash: 'SHA-256' },
            keyMaterial,
            { name: 'AES-GCM', length: 256 },
            false,
            ['encrypt', 'decrypt']
        );
    }

    // Encrypt
    document.getElementById('encryptBtn').addEventListener('click', function() {
        var plaintext = document.getElementById('plaintext').value;
        var password = document.getElementById('password').value;
        var errorEl = document.getElementById('encryptError');
        var resultEl = document.getElementById('encryptResult');
        errorEl.textContent = '';
        resultEl.style.display = 'none';

        if (!plaintext) { errorEl.textContent = 'Please enter a message to encrypt.'; return; }
        if (!password) { errorEl.textContent = 'Please enter a password.'; return; }
        if (password.length < 4) { errorEl.textContent = 'Password must be at least 4 characters.'; return; }

        var salt = crypto.getRandomValues(new Uint8Array(16));
        var iv = crypto.getRandomValues(new Uint8Array(12));
        var enc = new TextEncoder();

        getKeyMaterial(password).then(function(keyMaterial) {
            return deriveKey(keyMaterial, salt).then(function(key) {
                return crypto.subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(plaintext));
            }).then(function(ciphertext) {
                // salt(16) + iv(12) + ciphertext
                var combined = new Uint8Array(16 + 12 + new Uint8Array(ciphertext).length);
                combined.set(salt, 0);
                combined.set(iv, 16);
                combined.set(new Uint8Array(ciphertext), 28);
                var b64 = arrayBufferToBase64(combined.buffer);
                document.getElementById('ciphertext').value = b64;
                resultEl.style.display = 'block';
            });
        }).catch(function(err) {
            errorEl.textContent = 'Encryption failed: ' + err.message;
        });
    });

    // Copy encrypt

        var btn = document.getElementById('copyEncryptBtn');
        btn.textContent = '✅ Copied!';
        setTimeout(function() { btn.textContent = '📋 Copy'; }, 2000);
    });

    // Decrypt
    document.getElementById('decryptBtn').addEventListener('click', function() {
        var cipherB64 = document.getElementById('ciphertextInput').value.trim();
        var password = document.getElementById('decryptPassword').value;
        var errorEl = document.getElementById('decryptError');
        var resultEl = document.getElementById('decryptResult');
        errorEl.textContent = '';
        resultEl.style.display = 'none';

        if (!cipherB64) { errorEl.textContent = 'Please enter the encrypted text.'; return; }
        if (!password) { errorEl.textContent = 'Please enter the password.'; return; }

        var combined;
        try {
            combined = new Uint8Array(base64ToArrayBuffer(cipherB64));
        } catch(e) {
            errorEl.textContent = 'Invalid Base64 input. Please check the encrypted text.';
            return;
        }

        if (combined.length < 29) {
            errorEl.textContent = 'Invalid ciphertext: too short. Must be at least salt(16) + iv(12) + 1 byte.';
            return;
        }

        var salt = combined.slice(0, 16);
        var iv = combined.slice(16, 28);
        var ciphertext = combined.slice(28);

        getKeyMaterial(password).then(function(keyMaterial) {
            return deriveKey(keyMaterial, salt).then(function(key) {
                return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ciphertext);
            }).then(function(plainBuffer) {
                var dec = new TextDecoder();
                document.getElementById('plaintextOutput').value = dec.decode(plainBuffer);
                resultEl.style.display = 'block';
            });
        }).catch(function(err) {
            errorEl.textContent = 'Decryption failed. Wrong password or corrupted data.';
        });
    });
