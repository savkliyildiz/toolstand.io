<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.header,.footer,.embed-cta,#embed-section,.ad-banner{display:none}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

.sig-container {
  max-width: 620px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.sig-input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 1.1rem;
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
}
.sig-input:focus { outline: none; border-color: var(--primary); }

/* Preview — checkerboard behind canvas */
.sig-preview-wrap {
  background: var(--bg-card);
  border: 2px solid var(--border);
  border-radius: var(--radius);
  min-height: 150px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background-image:
    linear-gradient(45deg, var(--border) 25%, transparent 25%),
    linear-gradient(-45deg, var(--border) 25%, transparent 25%),
    linear-gradient(45deg, transparent 75%, var(--border) 75%),
    linear-gradient(-45deg, transparent 75%, var(--border) 75%);
  background-size: 16px 16px;
  background-position: 0 0, 0 8px, 8px -8px, -8px 0;
}

.sig-preview-wrap canvas {
  display: block;
  max-width: 100%;
}

.sig-empty {
  color: var(--text-secondary);
  font-size: 1.1rem;
  font-style: italic;
  position: absolute;
}

/* Font selector */
.sig-fonts {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
  gap: 8px;
}
.sig-font-btn {
  padding: 10px 8px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg-card);
  cursor: pointer;
  font-size: 1.05rem;
  color: var(--text);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.15s;
}
.sig-font-btn:hover { border-color: var(--primary); }
.sig-font-btn.active { border-color: var(--primary); background: var(--primary); color: white; }

/* Controls */
.sig-controls {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  align-items: center;
}
.sig-control-group { display: flex; flex-direction: column; gap: 4px; min-width: 100px; }
.sig-control-group label { font-size: 0.8rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; }
.sig-color-input { width: 44px; height: 40px; border: 2px solid var(--border); border-radius: 8px; cursor: pointer; padding: 2px; background: var(--bg); }
.sig-slider { width: 100%; accent-color: var(--primary); cursor: pointer; }
.sig-slider-value { font-size: 0.85rem; font-weight: 600; color: var(--text); }

.sig-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

@media (max-width: 640px) {
  .sig-fonts { grid-template-columns: repeat(2, 1fr); }
  .sig-controls { flex-direction: column; gap: 12px; }
  .sig-preview-wrap { min-height: 120px; }
}

/* Header/footer overrides */
.tool-container { padding: 0; max-width: 100%; }
.tool-header { text-align: center; margin-bottom: 8px; }
.tool-header h1 { font-size: 1.8rem; font-weight: 800; }
.tool-header p { color: var(--text-secondary); font-size: 1rem; margin-top: 4px; }
.powered-by{text-align:center;padding:12px;margin-top:16px;font-size:.75rem;color:var(--text-secondary)}
.powered-by a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
<script src="/shared/bot-detect.js" defer></script>
<script src="/shared/analytics.js"></script>
</head><body class="embed-page">
<main class="tool-container">
<div class="tool-header">
    <h1>✍️ Signature Generator</h1>
    <p>Turn your name into a beautiful handwritten signature. Download as a transparent PNG — perfect for documents, emails, and branding.</p>
  </div>

  <input type="text" id="sigText" class="sig-input" placeholder="Type your name or signature text..." maxlength="80">

  <div class="sig-fonts" id="sigFonts">
    <button class="sig-font-btn active" data-font="'Dancing Script', cursive" style="font-family:'Dancing Script',cursive">Dancing Script</button>
    <button class="sig-font-btn" data-font="'Pacifico', cursive" style="font-family:'Pacifico',cursive">Pacifico</button>
    <button class="sig-font-btn" data-font="'Caveat', cursive" style="font-family:'Caveat',cursive">Caveat</button>
    <button class="sig-font-btn" data-font="'Great Vibes', cursive" style="font-family:'Great Vibes',cursive">Great Vibes</button>
    <button class="sig-font-btn" data-font="'Tangerine', cursive" style="font-family:'Tangerine',cursive">Tangerine</button>
    <button class="sig-font-btn" data-font="'Alex Brush', cursive" style="font-family:'Alex Brush',cursive">Alex Brush</button>
    <button class="sig-font-btn" data-font="'Allura', cursive" style="font-family:'Allura',cursive">Allura</button>
    <button class="sig-font-btn" data-font="'Homemade Apple', cursive" style="font-family:'Homemade Apple',cursive">Homemade Apple</button>
    <button class="sig-font-btn" data-font="'Sacramento', cursive" style="font-family:'Sacramento',cursive">Sacramento</button>
    <button class="sig-font-btn" data-font="'Satisfy', cursive" style="font-family:'Satisfy',cursive">Satisfy</button>
  </div>

  <div class="sig-controls">
    <div class="sig-control-group">
      <label>Ink Color</label>
      <input type="color" id="sigColor" class="sig-color-input" value="#1a1a2e">
    </div>
    <div class="sig-control-group" style="flex:1;min-width:150px;">
      <label>Font Size <span class="sig-slider-value" id="sizeValue">72px</span></label>
      <input type="range" id="sigSize" class="sig-slider" min="24" max="160" value="72">
    </div>
  </div>

  <!-- PREVIEW — canvas lives here permanently -->
  <div class="sig-preview-wrap" id="sigPreview">
    <canvas id="sigCanvas"></canvas>
    <span class="sig-empty" id="sigEmpty">Type your name above to see your signature</span>
  </div>

  <div class="sig-actions">
    <button class="btn" id="downloadBtn" disabled>⬇ Download PNG</button>
    <button class="btn btn-outline" id="copyBtn" disabled>📋 Copy to Clipboard</button>
</main>
<div class="powered-by"><a href="https://toolstand.io/tools/signature-generator/" target="_blank" rel="noopener">Powered by ToolStand Signature Generator</a></div>
<script>
(function(){
  'use strict';
// ── DOM refs
var sigText   = document.getElementById('sigText');
var sigColor  = document.getElementById('sigColor');
var sigSize   = document.getElementById('sigSize');
var sizeValue = document.getElementById('sizeValue');
var sigCanvas = document.getElementById('sigCanvas');
var sigEmpty  = document.getElementById('sigEmpty');
var downloadBtn = document.getElementById('downloadBtn');
var copyBtn     = document.getElementById('copyBtn');
var fontBtns    = document.querySelectorAll('.sig-font-btn');
var themeToggle = // ── State
var currentFont = "'Dancing Script', cursive";
var cvs = sigCanvas;
var ctx = cvs.getContext('2d');

// ── Theme
if (themeToggle) {
  themeToggle.addEventListener('click', function() {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('toolstand-theme', next);
  });
}

// ── Render
function render() {
  var text = sigText.value.trim();
  var fontSize = parseInt(sigSize.value, 10) || 72;
  var color = sigColor.value || '#1a1a2e';

  // Empty state
  if (!text) {
    cvs.style.display = 'none';
    sigEmpty.style.display = '';
    downloadBtn.disabled = true;
    copyBtn.disabled = true;
    return;
  }

  // Measure text width using a temporary canvas
  ctx.font = fontSize + 'px ' + currentFont;
  var metrics = ctx.measureText(text);
  var textW = metrics.width;

  // Calculate dimensions with padding
  var padX = fontSize * 0.6;
  var padY = fontSize * 0.7;
  var w = Math.max(120, Math.ceil(textW + padX * 2));
  var h = Math.max(60, Math.ceil(fontSize * 2 + padY * 2));

  // Clamp width to container
  var container = cvs.parentElement;
  var maxW = (container.clientWidth || window.innerWidth) - 16;
  if (w > maxW) w = maxW;

  // Resize canvas
  cvs.width = w;
  cvs.height = h;
  cvs.style.display = 'block';
  sigEmpty.style.display = 'none';

  // Draw
  ctx.clearRect(0, 0, w, h);
  ctx.font = fontSize + 'px ' + currentFont;
  ctx.fillStyle = color;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'center';
  ctx.fillText(text, w / 2, h / 2);

  downloadBtn.disabled = false;
  copyBtn.disabled = false;
}

// ── Download
function download() {
  if (!sigText.value.trim()) return;
  var link = document.createElement('a');
  link.download = 'signature.png';
  link.href = cvs.toDataURL('image/png');
  link.click();
}

// ── Copy
function copyClip() {
  if (!sigText.value.trim()) return;
  try {
    cvs.toBlob(function(blob) {
      navigator.clipboard.write([new ClipboardItem({'image/png': blob})]).then(function() {
        var orig = copyBtn.textContent;
        copyBtn.textContent = '✅ Copied!';
        setTimeout(function() { copyBtn.textContent = orig; }, 1500);
      }).catch(function() {
        alert('Could not copy. Try downloading instead.');
      });
    }, 'image/png');
  } catch(e) {
    alert('Could not copy. Try downloading instead.');
  }
}

// ── Events
sigText.addEventListener('input', function() {
  localStorage.setItem('sig-text', sigText.value);
  render();
});

sigColor.addEventListener('input', function() {
  localStorage.setItem('sig-color', sigColor.value);
  render();
});

sigSize.addEventListener('input', function() {
  sizeValue.textContent = sigSize.value + 'px';
  localStorage.setItem('sig-size', sigSize.value);
  render();
});

fontBtns.forEach(function(btn) {
  btn.addEventListener('click', function() {
    fontBtns.forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentFont = btn.getAttribute('data-font');
    localStorage.setItem('sig-font', currentFont);
    render();
  });
});

downloadBtn.addEventListener('click', download);
copyBtn.addEventListener('click', copyClip);

// Resize
var resizeTimer;
window.addEventListener('resize', function() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(render, 150);
});

// ── Restore state
var savedText  = localStorage.getItem('sig-text');
var savedFont  = localStorage.getItem('sig-font');
var savedColor = localStorage.getItem('sig-color');
var savedSize  = localStorage.getItem('sig-size');

if (savedText)  sigText.value = savedText;
if (savedFont) {
  currentFont = savedFont;
  fontBtns.forEach(function(b) {
    b.classList.remove('active');
    if (b.getAttribute('data-font') === savedFont) b.classList.add('active');
  });
}
if (savedColor) sigColor.value = savedColor;
if (savedSize) {
  sigSize.value = savedSize;
  sizeValue.textContent = savedSize + 'px';
}

// Initial render
if (savedText) render();

// Re-render when fonts load
if (document.fonts && document.fonts.ready) {
  document.fonts.ready.then(function() {
    if (sigText.value.trim()) render();
  });
}

// Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js');
}
  var s=localStorage.getItem('toolstand-theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
})();
</script>
</body></html>
