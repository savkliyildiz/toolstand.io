<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMI Calculator — Embed</title>

<script type="application/ld+json">{"@context":"https://schema.org","@type":["WebApplication","SoftwareApplication"],"name":"BMI Calculator","url":"https://toolstand.io/tools/bmi-calculator/","applicationCategory":"CalculatorApplication","operatingSystem":"All","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"isAccessibleForFree":true}</script>
<style>
.header,.footer,.embed-cta,#embed-section,.ad-banner{display:none}
.bmi-inputs {
  display: flex;
  flex-direction: column;
  gap: 16px;
  margin-bottom: 20px;
}
.unit-toggle {
  display: flex;
  gap: 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  width: fit-content;
  margin: 0 auto;
}
.unit-toggle button {
  padding: 8px 20px;
  border: none;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 600;
  background: var(--bg-card);
  color: var(--text-secondary);
  transition: all 0.15s;
}
.unit-toggle button.active {
  background: var(--primary);
  color: white;
}
.input-row {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
.input-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.input-group label {
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--text-secondary);
}
.input-group input {
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  font-size: 1rem;
  background: var(--bg);
  color: var(--text);
  width: 140px;
  text-align: center;
  transition: border-color 0.15s;
}
.input-group input:focus {
  outline: none;
  border-color: var(--primary);
}
.bmi-result {
  text-align: center;
  margin: 24px 0;
}
.bmi-value {
  font-size: 3.5rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.bmi-category {
  font-size: 1.2rem;
  font-weight: 700;
  margin-top: 4px;
}
.bmi-scale {
  position: relative;
  height: 24px;
  border-radius: 12px;
  margin: 20px 0 8px;
  background: linear-gradient(to right,
    #3b82f6 0%, #3b82f6 18.5%,
    #22c55e 18.5%, #22c55e 25%,
    #eab308 25%, #eab308 30%,
    #f97316 30%, #f97316 35%,
    #ef4444 35%, #ef4444 100%
  );
}
.bmi-marker {
  position: absolute;
  top: -6px;
  width: 16px;
  height: 36px;
  background: var(--text);
  border-radius: 4px;
  transform: translateX(-50%);
  transition: left 0.3s;
}
.bmi-labels {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  color: var(--text-secondary);
}
.disclaimer {
  font-size: 0.8rem;
  color: var(--text-secondary);
  text-align: center;
  margin-top: 16px;
  font-style: italic;
}
.powered-by{text-align:center;padding:12px;margin-top:16px;font-size:.75rem;color:var(--text-secondary)}
.powered-by a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
<script src="/shared/bot-detect.js" defer></script>
<script src="/shared/analytics.js"></script>
</head><body class="embed-page">
<main class="tool-container">
<div class="tool-header">
    <h1>⚖️ BMI Calculator</h1>
    <p>Calculate your Body Mass Index — free, instant, no signup required.</p>
  </div>
  <div class="unit-toggle" id="unitToggle">
    <button class="active" data-unit="metric">Metric (kg / cm)</button>
    <button data-unit="imperial">Imperial (lbs / ft-in)</button>
  </div>
  <div class="bmi-inputs" id="metricInputs">
    <div class="input-row">
      <div class="input-group">
        <label for="weightKg">Weight (kg)</label>
        <input type="number" id="weightKg" placeholder="70" min="1" step="0.1">
      </div>
      <div class="input-group">
        <label for="heightCm">Height (cm)</label>
        <input type="number" id="heightCm" placeholder="170" min="1" step="0.1">
      </div>
    </div>
  </div>
  <div class="bmi-inputs" id="imperialInputs" style="display:none">
    <div class="input-row">
      <div class="input-group">
        <label for="weightLbs">Weight (lbs)</label>
        <input type="number" id="weightLbs" placeholder="154" min="1" step="0.1">
      </div>
      <div class="input-group">
        <label for="heightFt">Height (ft)</label>
        <input type="number" id="heightFt" placeholder="5" min="0" step="1">
      </div>
      <div class="input-group">
        <label for="heightIn">Height (in)</label>
        <input type="number" id="heightIn" placeholder="7" min="0" max="11" step="0.1">
      </div>
    </div>
  </div>
  <div class="bmi-result" id="bmiResult" style="display:none">
    <div class="bmi-value" id="bmiValue">—</div>
    <div class="bmi-category" id="bmiCategory">—</div>
  </div>
  <div class="bmi-scale" id="bmiScale" style="display:none">
    <div class="bmi-marker" id="bmiMarker"></div>
  </div>
  <div class="bmi-labels" id="bmiLabels" style="display:none">
    <span>Under</span><span>Normal</span><span>Over</span><span>Obese</span>
  </div>
  <p class="disclaimer">⚠️ BMI is a screening tool, not a medical diagnosis. Consult a healthcare professional for personalized advice.</p>
</main>
<div class="powered-by"><a href="https://toolstand.io/tools/bmi-calculator/" target="_blank" rel="noopener">Powered by ToolStand BMI Calculator</a></div>

  'use strict';

  var s=localStorage.getItem('toolstand-theme')||'light';

})();
</script>
</body></html>
