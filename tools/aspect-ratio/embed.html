.ar-result-dims { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
.ar-presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
.ar-preset { padding: 8px 16px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--bg-card); color: var(--text); cursor: pointer; font-size: 0.82rem; font-weight: 600; transition: all 0.15s; display: flex; align-items: center; gap: 6px; }
.ar-preset:hover { border-color: #22c55e; background: rgba(34,197,94,0.05); }
.ar-preset.ar-active { border-color: #22c55e; background: rgba(34,197,94,0.1); color: #22c55e; }
.ar-preset-badge { font-size: 0.65rem; background: var(--bg); padding: 2px 6px; border-radius: 4px; color: var(--text-secondary); }
.ar-scale-section { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-top: 4px; }
.ar-scale-section h3 { font-size: 0.95rem; font-weight: 700; margin: 0 0 12px 0; display: flex; align-items: center; gap: 8px; }
.ar-scale-inputs { display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: end; }
.ar-scale-eq { font-size: 1.2rem; font-weight: 700; color: var(--text-secondary); text-align: center; padding-bottom: 10px; }
.ar-scale-result { grid-column: 1 / -1; text-align: center; padding: 10px; background: var(--bg); border-radius: var(--radius); margin-top: 4px; font-size: 0.9rem; font-weight: 600; color: #22c55e; }
.ar-preview { margin-top: 8px; }
.ar-preview h3 { font-size: 0.95rem; font-weight: 700; margin: 0 0 10px 0; }

.ar-svg-wrap svg { max-width: 100%; height: auto; }
@media (max-width: 640px) {
  .ar-inputs { grid-template-columns: 1fr; }

}

    <div>
      <label style="font-size:0.85rem;font-weight:600;color:var(--text-secondary);display:block;margin-bottom:8px">📋 Social Media Presets</label>

        <button class="ar-preset" data-w="1920" data-h="1080">▶️ YouTube <span class="ar-preset-badge">16:9</span></button>

        <button class="ar-preset" data-w="1200" data-h="675">🐦 X/Twitter <span class="ar-preset-badge">16:9</span></button>
        <button class="ar-preset" data-w="1200" data-h="1200">📘 Facebook <span class="ar-preset-badge">1:1</span></button>
        <button class="ar-preset" data-w="1920" data-h="1080">🖥️ Facebook <span class="ar-preset-badge">16:9</span></button>
      </div>
    </div>

    <div class="ar-inputs">
      <div class="ar-input-group"><label for="arWidth">Width (px)</label><input type="number" id="arWidth" value="1920" min="1" step="1"></div>
      <div class="ar-input-group"><label for="arHeight">Height (px)</label><input type="number" id="arHeight" value="1080" min="1" step="1"></div>

      <div class="ar-scale-result" id="arScaleResult">
</main>

<script>
(function(){
  'use strict';
var el = function(id) { return document.getElementById(id); };

  function gcd(a, b) {
    a = Math.abs(a); b = Math.abs(b);
    while (b) { var t = b; b = a % b; a = t; }
    return a || 1;
  }

  function simplifyRatio(w, h) {
    var g = gcd(w, h);
    return { w: w / g, h: h / g, gcd: g };
  }

  function toDecimal(ratio) {
    return ratio.w / ratio.h;
  }

  function drawPreview(w, h) {
    var maxW = 500;
    var scale = Math.min(1, maxW / w);
    var pw = Math.round(w * scale);
    var ph = Math.round(h * scale);
    var svg = '<svg width="' + pw + '" height="' + ph + '" viewBox="0 0 ' + pw + ' ' + ph + '" xmlns="http://www.w3.org/2000/svg">';
    svg += '<rect x="0" y="0" width="' + pw + '" height="' + ph + '" rx="4" fill="none" stroke="#22c55e" stroke-width="2"/>';
    svg += '<line x1="0" y1="0" x2="' + pw + '" y2="' + ph + '" stroke="#22c55e" stroke-width="1" opacity="0.2"/>';
    svg += '<line x1="' + pw + '" y1="0" x2="0" y2="' + ph + '" stroke="#22c55e" stroke-width="1" opacity="0.2"/>';
    svg += '<text x="' + (pw/2) + '" y="' + (ph/2 - 8) + '" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">' + w + ' × ' + h + '</text>';
    svg += '<text x="' + (pw/2) + '" y="' + (ph/2 + 12) + '" text-anchor="middle" font-size="12" fill="#22c55e">' + simplifyRatio(w,h).w + ':' + simplifyRatio(w,h).h + '</text>';
    svg += '</svg>';
    el('arSvgWrap').innerHTML = svg;
  }

  function calculate() {
    var w = parseInt(el('arWidth').value) || 1920;
    var h = parseInt(el('arHeight').value) || 1080;
    if (w < 1) w = 1; if (h < 1) h = 1;
    var ratio = simplifyRatio(w, h);
    el('arRatio').textContent = ratio.w + ':' + ratio.h;
    el('arDims').textContent = w + ' × ' + h + '  (GCD: ' + ratio.gcd + ')';
    drawPreview(w, h);
    updateScale();
  }

  function updateScale() {
    var w = parseInt(el('arWidth').value) || 1920;
    var h = parseInt(el('arHeight').value) || 1080;
    var dim = parseFloat(el('arScaleDim').value) || 0;
    var side = el('arScaleSide').value;
    if (dim <= 0) { el('arScaleResult').textContent = ''; return; }
    if (side === 'width') {
      var newH = Math.round(dim * h / w);
      el('arScaleResult').innerHTML = 'Width <strong>' + dim + '</strong>px → Height <strong>' + newH + '</strong>px  (keeps ' + simplifyRatio(w,h).w + ':' + simplifyRatio(w,h).h + ')';
    } else {
      var newW = Math.round(dim * w / h);
      el('arScaleResult').innerHTML = 'Height <strong>' + dim + '</strong>px → Width <strong>' + newW + '</strong>px  (keeps ' + simplifyRatio(w,h).w + ':' + simplifyRatio(w,h).h + ')';
    }
  }

  function setPreset(w, h, btn) {
    el('arWidth').value = w;
    el('arHeight').value = h;
    document.querySelectorAll('.ar-preset').forEach(function(b) { b.classList.remove('ar-active'); });
    btn.classList.add('ar-active');
    calculate();
  }

  el('arPresets').addEventListener('click', function(e) {
    var btn = e.target.closest('.ar-preset');
    if (!btn) return;
    var w = parseInt(btn.dataset.w);
    var h = parseInt(btn.dataset.h);
    setPreset(w, h, btn);
  });

  el('arWidth').addEventListener('input', function() { document.querySelectorAll('.ar-preset').forEach(function(b) { b.classList.remove('ar-active'); }); calculate(); });
  el('arHeight').addEventListener('input', function() { document.querySelectorAll('.ar-preset').forEach(function(b) { b.classList.remove('ar-active'); }); calculate(); });
  el('arScaleDim').addEventListener('input', updateScale);
  el('arScaleSide').addEventListener('change', updateScale);

  calculate();

  var themeToggle = themeToggle.addEventListener('click', function() {
    var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('toolstand-theme', next);
    calculate();
  });
  var s=localStorage.getItem('toolstand-theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
})();
</script>
