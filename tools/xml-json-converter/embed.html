></div></div></div></div></div>

<script>
(function(){
  'use strict';

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function xmlToJson(xmlStr) {
    var parser = new DOMParser();
    var doc = parser.parseFromString(xmlStr, 'text/xml');
    var errEl = doc.querySelector('parsererror');
    if (errEl) return { error: errEl.textContent.replace(/\n/g, ' ').trim() };

    function elementToObj(el) {
      var obj = {};
      if (el.attributes && el.attributes.length > 0) {
        for (var a = 0; a < el.attributes.length; a++) {
          obj['@' + el.attributes[a].name] = el.attributes[a].value;
        }
      }
      var childElements = [];
      var textContent = '';
      for (var c = 0; c < el.childNodes.length; c++) {
        var node = el.childNodes[c];
        if (node.nodeType === 1) { childElements.push(node); }
        else if (node.nodeType === 3) { var t = node.textContent.trim(); if (t) textContent += t; }
      }
      if (childElements.length > 0) {
        var groups = {};
        for (var i = 0; i < childElements.length; i++) {
          var child = childElements[i];
          var tag = child.nodeName;
          if (!groups[tag]) groups[tag] = [];
          groups[tag].push(elementToObj(child));
        }
        for (var key in groups) {
          if (!groups.hasOwnProperty(key)) continue;
          obj[key] = groups[key].length === 1 ? groups[key][0] : groups[key];
        }
        if (textContent) obj['#text'] = textContent;
      } else {
        if (textContent) {
          if (Object.keys(obj).length === 0) return textContent;
          obj['#text'] = textContent;
        } else if (Object.keys(obj).length === 0) { return ''; }
      }
      return obj;
    }
    return elementToObj(doc.documentElement);
  }

  function escXml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function jsonToXml(obj, rootName) {
    if (!rootName) rootName = 'root';
    function objToXml(name, val, indent) {
      var xml = '';
      if (Array.isArray(val)) {
        for (var i = 0; i < val.length; i++) { xml += objToXml(name, val[i], indent); }
      } else if (typeof val === 'object' && val !== null) {
        var attrs = '', children = '', textVal = '';
        var keys = Object.keys(val);
        for (var k = 0; k < keys.length; k++) {
          var key = keys[k], v = val[key];
          if (key === '#text') { textVal = escXml(v); }
          else if (key.indexOf('@') === 0) { attrs += ' ' + key.substring(1) + '="' + escXml(String(v)) + '"'; }
          else { children += objToXml(key, v, indent + '  '); }
        }
        if (attrs || children || textVal) {
          xml += indent + '<' + name + attrs;
          if (!children && !textVal) { xml += '/>\n'; }
          else if (!children) { xml += '>' + textVal + '</' + name + '>\n'; }
          else { xml += '>\n' + children + indent + '</' + name + '>\n'; }
        }
      } else { xml += indent + '<' + name + '>' + escXml(String(val)) + '</' + name + '>\n'; }
      return xml;
    }
    var result = '<?xml version="1.0" encoding="UTF-8"?>\n';
    result += objToXml(rootName, obj, '');
    return result.trim();
  }

  document.getElementById('tabX2J').addEventListener('click', function(){
    document.getElementById('panelX2J').style.display = 'block';
    document.getElementById('panelJ2X').style.display = 'none';
    document.getElementById('tabX2J').classList.add('active');
    document.getElementById('tabJ2X').classList.remove('active');
  });
  document.getElementById('tabJ2X').addEventListener('click', function(){
    document.getElementById('panelX2J').style.display = 'none';
    document.getElementById('panelJ2X').style.display = 'block';
    document.getElementById('tabJ2X').classList.add('active');
    document.getElementById('tabX2J').classList.remove('active');
  });

  document.getElementById('xjConvert').addEventListener('click', function(){
    var xml = document.getElementById('xjXmlIn').value;
    var out = document.getElementById('xjJsonOut');
    if (!xml.trim()) { out.innerHTML = '<p class="tc-err">Please enter XML.</p>'; return; }
    var json = xmlToJson(xml);
    if (json && json.error) { out.innerHTML = '<div class="tc-err">Invalid XML:\n' + esc(json.error) + '</div>'; return; }
    try { out.textContent = JSON.stringify(json, null, 2); }
    catch(e) { out.innerHTML = '<div class="tc-err">Error: ' + esc(e.message) + '</div>'; }
  });

  document.getElementById('xjCopy').addEventListener('click', function(){
    var text = document.getElementById('xjJsonOut').textContent;
    navigator.clipboard.writeText(text).then(function(){
      var btn = document.getElementById('xjCopy'), orig = btn.textContent;
      btn.textContent = 'Copied!'; setTimeout(function(){ btn.textContent = orig; }, 1500);
    });
  });

  document.getElementById('xjConvertBack').addEventListener('click', function(){
    var jsonStr = document.getElementById('xjJsonIn').value;
    var out = document.getElementById('xjXmlOut');
    if (!jsonStr.trim()) { out.innerHTML = '<p class="tc-err">Please enter JSON.</p>'; return; }
    var obj;
    try { obj = JSON.parse(jsonStr); }
    catch(e) { out.innerHTML = '<div class="tc-err">Invalid JSON:\n' + esc(e.message) + '</div>'; return; }
    var rootName = Object.keys(obj)[0] || 'root';
    out.textContent = jsonToXml(obj[rootName], rootName);
  });

  document.getElementById('xjCopyBack').addEventListener('click', function(){
    var text = document.getElementById('xjXmlOut').textContent;
    navigator.clipboard.writeText(text).then(function(){
      var btn = document.getElementById('xjCopyBack'), orig = btn.textContent;
      btn.textContent = 'Copied!'; setTimeout(function(){ btn.textContent = orig; }, 1500);
    });
  });

  if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
  document.getElementById('xjConvert').click();
})();
</script>
