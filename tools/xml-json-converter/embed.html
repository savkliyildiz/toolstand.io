  // ── XML → JSON ────────────────────────────────────────
  function xmlToJson(xmlStr) {
    var parser = new DOMParser();
    var doc = parser.parseFromString(xmlStr, 'text/xml');
    var errEl = doc.querySelector('parsererror');
    if (errEl) return { error: errEl.textContent.replace(/\n/g, ' ').trim() };

      var obj = {};
      // Attributes → @-prefixed keys
      if (el.attributes && el.attributes.length > 0) {
        for (var a = 0; a < el.attributes.length; a++) {
          obj['@' + el.attributes[a].name] = el.attributes[a].value;
        }
      }
      var childElements = [];
      var textContent = '';
      for (var c = 0; c < el.childNodes.length; c++) {
        var node = el.childNodes[c];
        if (node.nodeType === 1) { // Element
          childElements.push(node);
        } else if (node.nodeType === 3) { // Text
          var t = node.textContent.trim();
          if (t) textContent += t;
        }
      }
      if (childElements.length > 0) {
        var groups = {};
        for (var i = 0; i < childElements.length; i++) {
          var child = childElements[i];
          var tag = child.nodeName;
          if (!groups[tag]) groups[tag] = [];
          groups[tag].push(elementToObj(child));
        }
        for (var key in groups) {
          if (!groups.hasOwnProperty(key)) continue;
          obj[key] = groups[key].length === 1 ? groups[key][0] : groups[key];
        }
        if (textContent) obj['#text'] = textContent;
      } else {
        if (textContent) {
          if (Object.keys(obj).length === 0) return textContent;
          obj['#text'] = textContent;
        } else if (Object.keys(obj).length === 0) {

        }
      }
      return obj;
    }
    return elementToObj(doc.documentElement);
  }

      if (Array.isArray(val)) {

          xml += objToXml(name, val[i], indent);
        }
      } else if (typeof val === 'object' && val !== null) {
        var attrs = '';
        var children = '';
        var textVal = '';
        var keys = Object.keys(val);
        for (var k = 0; k < keys.length; k++) {
          var key = keys[k];
          var v = val[key];
          if (key === '#text') {
            textVal = escXml(v);
          } else if (key.indexOf('@') === 0) {
            attrs += ' ' + key.substring(1) + '="' + escXml(String(v)) + '"';
          } else {
            children += objToXml(key, v, indent + '  ');
          }
        }
        if (attrs || children || textVal) {
          xml += indent + '<' + name + attrs;
          if (!children && !textVal) {
            xml += '/>\n';
          } else if (!children) {
            xml += '>' + textVal + '</' + name + '>\n';
          } else {
            xml += '>\n' + children + indent + '</' + name + '>\n';
          }
        }
      } else {
        xml += indent + '<' + name + '>' + escXml(String(val)) + '</' + name + '>\n';
      }
      return xml;
    }
    var result = '<?xml version="1.0" encoding="UTF-8"?>\n';
    result += objToXml(rootName, obj, '');
    return result.trim();
  }

  // ── XML → JSON Convert ────────────────────────────────

    var json = xmlToJson(xml);
    if (json && json.error) {

    try {

  document.getElementById('xjConvertBack').addEventListener('click', function(){

    try {

    var xml = jsonToXml(obj[rootName], rootName);
    out.textContent = xml;
  });
