<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON Minifier — Embed</title>
<link rel="stylesheet" href="/shared/styles.css">
<script type="application/ld+json">{"@context":"https://schema.org","@type":["WebApplication","SoftwareApplication"],"name":"JSON Minifier","url":"https://toolstand.io/tools/json-minifier/","applicationCategory":"UtilitiesApplication","operatingSystem":"All","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"isAccessibleForFree":true}</script>
<style>
.header,.footer,.embed-cta,#embed-section,.ad-banner{display:none}
.jmn-container { display: flex; flex-direction: column; gap: 16px; }
.jmn-textarea { width: 100%; min-height: 200px; padding: 14px; font-size: 0.9rem; border: 2px solid var(--border); border-radius: var(--radius); background: var(--bg); color: var(--text); resize: vertical; font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; box-sizing: border-box; line-height: 1.5; }
.jmn-textarea:focus { outline: none; border-color: #3b82f6; }
.jmn-textarea[readonly] { background: var(--bg-card); cursor: default; }
.jmn-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.jmn-btn { padding: 10px 22px; font-weight: 700; border: none; border-radius: var(--radius); cursor: pointer; font-size: 0.9rem; transition: opacity 0.15s; }
.jmn-btn-primary { background: #3b82f6; color: white; }
.jmn-btn-primary:hover { opacity: 0.9; }
.jmn-btn-outline { background: var(--bg-card); border: 1px solid var(--border); color: var(--text); }
.jmn-btn-outline:hover { background: var(--border); }
.jmn-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.jmn-stat { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; text-align: center; }
.jmn-stat-value { font-size: 1.3rem; font-weight: 700; color: #3b82f6; }
.jmn-stat-label { font-size: 0.7rem; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; margin-top: 2px; }
.jmn-stat.jmn-reduction .jmn-stat-value { color: #22c55e; }
.jmn-error { background: #fef2f2; border-left: 4px solid #ef4444; padding: 10px 14px; border-radius: 0 var(--radius) var(--radius) 0; display: none; color: #991b1b; font-size: 0.85rem; }
.jmn-error.show { display: block; }
.powered-by{text-align:center;padding:12px;margin-top:16px;font-size:.75rem;color:var(--text-secondary)}
.powered-by a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
<script src="/shared/bot-detect.js" defer></script>
<script src="/shared/analytics.js"></script>
</head><body class="embed-page">
<main class="tool-container">
<div class="tool-header">
    <h1>📦 JSON Minifier — Compress JSON to Smallest Size</h1>
    <p>Minify and compress JSON data. Remove all unnecessary whitespace. Free, browser-based, works offline.</p>
  </div>

  <div class="jmn-container">
    <textarea class="jmn-textarea" id="jmnInput" placeholder="Paste your JSON here...&#10;{&#10;  &quot;name&quot;: &quot;ToolStand&quot;,&#10;  &quot;version&quot;: &quot;2.0&quot;,&#10;  &quot;tools&quot;: 99&#10;}"></textarea>

    <div class="jmn-error" id="jmnError"></div>

    <div class="jmn-actions">
      <button class="jmn-btn jmn-btn-primary" id="jmnMinifyBtn">📦 Minify JSON</button>
      <button class="jmn-btn jmn-btn-outline" id="jmnClearBtn">🗑️ Clear</button>
    </div>

    <div class="jmn-stats" id="jmnStats" style="display:none">
      <div class="jmn-stat">
        <div class="jmn-stat-value" id="jmnOriginalSize">—</div>
        <div class="jmn-stat-label">Original Size</div>
      </div>
      <div class="jmn-stat">
        <div class="jmn-stat-value" id="jmnMinifiedSize">—</div>
        <div class="jmn-stat-label">Minified Size</div>
      </div>
      <div class="jmn-stat jmn-reduction">
        <div class="jmn-stat-value" id="jmnReduction">—</div>
        <div class="jmn-stat-label">Reduction</div>
      </div>
    </div>

    <textarea class="jmn-textarea" id="jmnOutput" readonly placeholder="Minified JSON will appear here..." style="display:none"></textarea>

    <div class="jmn-actions" id="jmnOutputActions" style="display:none">
      <button class="jmn-btn jmn-btn-primary" id="jmnCopyBtn">📋 Copy</button>
    </div>
  </div>

    

  <section class="seo-content">
</main>
<div class="powered-by"><a href="https://toolstand.io/tools/json-minifier/" target="_blank" rel="noopener">Powered by ToolStand JSON Minifier</a></div>
<script>
(function(){
  'use strict';
function formatBytes(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
  }

  document.getElementById('jmnMinifyBtn').addEventListener('click', function() {
    var input = document.getElementById('jmnInput').value.trim();
    var errorEl = document.getElementById('jmnError');
    errorEl.classList.remove('show');

    if (!input) {
      errorEl.textContent = '⚠️ Please paste some JSON first.';
      errorEl.classList.add('show');
      return;
    }

    try {
      var parsed = JSON.parse(input);
      var minified = JSON.stringify(parsed);
      var originalSize = new Blob([input]).size;
      var minifiedSize = new Blob([minified]).size;
      var reduction = originalSize > 0 ? ((originalSize - minifiedSize) / originalSize * 100).toFixed(1) : 0;

      document.getElementById('jmnOriginalSize').textContent = formatBytes(originalSize);
      document.getElementById('jmnMinifiedSize').textContent = formatBytes(minifiedSize);
      document.getElementById('jmnReduction').textContent = (reduction > 0 ? '-' : '') + reduction + '%';

      document.getElementById('jmnOutput').value = minified;
      document.getElementById('jmnStats').style.display = '';
      document.getElementById('jmnOutput').style.display = '';
      document.getElementById('jmnOutputActions').style.display = '';

      window._jmnLastOutput = minified;
    } catch (e) {
      errorEl.innerHTML = '<strong>❌ Invalid JSON</strong><br>' + e.message;
      errorEl.classList.add('show');
      document.getElementById('jmnStats').style.display = 'none';
      document.getElementById('jmnOutput').style.display = 'none';
      document.getElementById('jmnOutputActions').style.display = 'none';
    }
  });

  document.getElementById('jmnCopyBtn').addEventListener('click', function() {
    var output = window._jmnLastOutput || document.getElementById('jmnOutput').value;
    if (!output) return;
    navigator.clipboard.writeText(output).then(function() {
      var btn = document.getElementById('jmnCopyBtn');
      btn.textContent = '✅ Copied!';
      setTimeout(function() { btn.textContent = '📋 Copy'; }, 1500);
    });
  });

  document.getElementById('jmnClearBtn').addEventListener('click', function() {
    document.getElementById('jmnInput').value = '';
    document.getElementById('jmnOutput').value = '';
    document.getElementById('jmnOutput').style.display = 'none';
    document.getElementById('jmnStats').style.display = 'none';
    document.getElementById('jmnOutputActions').style.display = 'none';
    document.getElementById('jmnError').classList.remove('show');
    window._jmnLastOutput = '';
  });
  var s=localStorage.getItem('toolstand-theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
})();
</script>
</body></html>
