</head><body class="embed-page">
<main class="tool-container">
<div class="tool-header">
    <h1>📊 CSV ↔ JSON Converter</h1>
    <p>Convert between CSV and JSON formats with smart parsing powered by PapaParse.</p>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="csv2json">CSV → JSON</button>
    <button class="tab-btn" data-tab="json2csv">JSON → CSV</button>
  </div>
  <div class="panel active" id="panel-csv2json">
    <label for="csvInput">CSV Input</label>
    <textarea id="csvInput" placeholder="name,age,city&#10;John,30,New York&#10;Jane,25,London"></textarea>
    <div class="controls-row">
      <div>
        <label for="delimiter">Delimiter</label>
        <select id="delimiter">
          <option value="auto">Auto-detect</option>
          <option value=",">Comma (,)</option>
          <option value=";">Semicolon (;)</option>
          <option value="\t">Tab</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btnCsv2Json">Convert to JSON</button>
    </div>
    <div id="csvPreview"></div>
    <div class="output-area" id="jsonOutputArea" style="display:none;">
      <label for="jsonOutput">JSON Output</label>
      <button class="btn btn-secondary btn-sm" id="btnCopyJson">📋 Copy</button>
      <textarea id="jsonOutput" readonly></textarea>
      <div class="success-msg" id="jsonCopyMsg">Copied to clipboard!</div>
    </div>
  </div>
  <div class="panel" id="panel-json2csv">
    <label for="jsonInput">JSON Input</label>
    <textarea id="jsonInput" placeholder='[{"name":"John","age":30,"city":"New York"},{"name":"Jane","age":25,"city":"London"}]'></textarea>
    <div class="controls-row">
      <div>
        <label for="csvDelimiter">Delimiter</label>
        <select id="csvDelimiter">
          <option value=",">Comma (,)</option>
          <option value=";">Semicolon (;)</option>
          <option value="\t">Tab</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btnJson2Csv">Convert to CSV</button>
    </div>
    <div class="output-area" id="csvOutputArea" style="display:none;">
      <label for="csvOutput">CSV Output</label>
      <button class="btn btn-secondary btn-sm" id="btnCopyCsv">📋 Copy</button>
      <textarea id="csvOutput" readonly></textarea>
      <div class="success-msg" id="csvCopyMsg">Copied to clipboard!</div>
    </div>
  </div>
</main>

<script>
(function(){
  'use strict';
// Theme toggle
  document.documentElement.setAttribute('data-theme',n);
    localStorage.setItem('toolstand-theme',n);
  });
  // Tab switching
  var tabs=document.querySelectorAll('.tab-btn');
  var panels=document.querySelectorAll('.panel');
  tabs.forEach(function(tab){
    tab.addEventListener('click',function(){
      tabs.forEach(function(t){t.classList.remove('active');});
      panels.forEach(function(p){p.classList.remove('active');});
      tab.classList.add('active');
      document.getElementById('panel-'+tab.dataset.tab).classList.add('active');
    });
  });

  // CSV to JSON
  document.getElementById('btnCsv2Json').addEventListener('click',function(){
    var csv=document.getElementById('csvInput').value.trim();
    if(!csv){alert('Please enter CSV data.');return;}
    var delimiter=document.getElementById('delimiter').value;
    var config={header:true,dynamicTyping:true,skipEmptyLines:true};
    if(delimiter!=='auto'){config.delimiter=delimiter==='\\t'?'\t':delimiter;}
    var result=Papa.parse(csv,config);
    if(result.errors.length>0){
      console.warn('Parse warnings:',result.errors);
    }
    var json=JSON.stringify(result.data,null,2);
    document.getElementById('jsonOutput').value=json;
    document.getElementById('jsonOutputArea').style.display='block';
    // Build preview table
    var preview=document.getElementById('csvPreview');
    if(result.data.length===0){
      preview.innerHTML='<p style="color:var(--text-secondary);margin-top:12px;">No data parsed.</p>';
      return;
    }
    var fields=result.meta.fields||Object.keys(result.data[0]);
    var html='<div style="overflow-x:auto;"><table class="preview-table"><thead><tr>';
    fields.forEach(function(f){html+='<th>'+escapeHtml(f)+'</th>';});
    html+='</tr></thead><tbody>';
    var rows=Math.min(result.data.length,50);
    for(var i=0;i<rows;i++){
      html+='<tr>';
      fields.forEach(function(f){
        var val=result.data[i][f];
        html+='<td>'+(val!==null&&val!==undefined?escapeHtml(String(val)):'')+'</td>';
      });
      html+='</tr>';
    }
    html+='</tbody></table></div>';
    if(result.data.length>50){
      html+='<p style="color:var(--text-secondary);font-size:0.8rem;margin-top:4px;">Showing first 50 of '+result.data.length+' rows.</p>';
    }
    preview.innerHTML=html;
  });

  // JSON to CSV
  document.getElementById('btnJson2Csv').addEventListener('click',function(){
    var json=document.getElementById('jsonInput').value.trim();
    if(!json){alert('Please enter JSON data.');return;}
    var data;
    try{data=JSON.parse(json);}catch(e){alert('Invalid JSON: '+e.message);return;}
    if(!Array.isArray(data)){alert('JSON must be an array of objects.');return;}
    var delimiter=document.getElementById('csvDelimiter').value;
    delimiter=delimiter==='\\t'?'\t':delimiter;
    var csv=Papa.unparse(data,{delimiter:delimiter});
    document.getElementById('csvOutput').value=csv;
    document.getElementById('csvOutputArea').style.display='block';
  });

  // Copy buttons
  document.getElementById('btnCopyJson').addEventListener('click',function(){
    var ta=document.getElementById('jsonOutput');
    ta.select();
    document.execCommand('copy');
    showMsg('jsonCopyMsg');
  });
  document.getElementById('btnCopyCsv').addEventListener('click',function(){
    var ta=document.getElementById('csvOutput');
    ta.select();
    document.execCommand('copy');
    showMsg('csvCopyMsg');
  });

  function showMsg(id){
    var el=document.getElementById(id);
    el.classList.add('show');
    setTimeout(function(){el.classList.remove('show');},2000);
  }

  function escapeHtml(str){
    var d=document.createElement('div');
    d.appendChild(document.createTextNode(str));
    return d.innerHTML;
  }
  var s=localStorage.getItem('toolstand-theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
})();
</script>
