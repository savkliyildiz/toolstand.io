<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
.header,.footer,.embed-cta,#embed-section,.ad-banner{display:none}
.ms-container { display: flex; flex-direction: column; align-items: center; gap: 20px; }
.ms-score { font-size: 1.2rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.ms-grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; background: var(--border); padding: 3px; border-radius: var(--radius); width: 100%; max-width: 400px; aspect-ratio: 1/1; }
.ms-cell { background: var(--bg-card); border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: background 0.1s; color: var(--text); user-select: none; aspect-ratio: 1/1; padding: 0; }
.ms-cell:hover { background: var(--border); }
.ms-cell.ms-revealed { background: var(--bg); cursor: default; }
.ms-cell.ms-revealed:hover { background: var(--bg); }
.ms-cell.ms-flagged { background: #fef3c7; }
.ms-cell.ms-mine { background: #fecaca; }
.ms-num-1 { color: #3b82f6; } .ms-num-2 { color: #22c55e; } .ms-num-3 { color: #ef4444; } .ms-num-4 { color: #7c3aed; }
.ms-num-5 { color: #b91c1c; } .ms-num-6 { color: #0891b2; } .ms-num-7 { color: #1e293b; } .ms-num-8 { color: #64748b; }
.ms-controls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.ms-difficulty { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.ms-diff-btn { padding: 8px 16px; border: none; cursor: pointer; font-size: 0.8rem; font-weight: 600; background: var(--bg-card); color: var(--text-secondary); transition: all 0.15s; }
.ms-diff-btn.ms-active { background: #8b5cf6; color: white; }
.ms-btn { padding: 10px 24px; font-size: 0.9rem; font-weight: 600; background: #8b5cf6; color: white; border: none; border-radius: var(--radius); cursor: pointer; transition: background 0.15s; }
.ms-btn:hover { background: #7c3aed; }
.ms-win { display: none; font-size: 1.4rem; font-weight: 800; color: #22c55e; text-align: center; }
.ms-win.ms-show { display: block; }
@media (max-width: 500px) { .ms-grid { max-width: 320px; } }
.powered-by{text-align:center;padding:12px;margin-top:16px;font-size:.75rem;color:var(--text-secondary)}
.powered-by a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
<script src="/shared/bot-detect.js" defer></script>
<script src="/shared/analytics.js"></script>
</head><body class="embed-page">
<main class="tool-container">
<div class="tool-header">
    <h1>💣 Minesweeper</h1>
    <p>Classic minesweeper right in your browser. Flag the mines, clear the board — perfect as a 404 page replacement. Free, no ads during play.</p>
  </div>

  <div class="ms-container">
    <div class="ms-difficulty" id="msDifficulty">
      <button class="ms-diff-btn ms-active" data-level="easy">Easy (9×9, 10)</button>
      <button class="ms-diff-btn" data-level="medium">Medium (16×16, 40)</button>
      <button class="ms-diff-btn" data-level="hard">Hard (30×16, 99)</button>
    </div>

    <div class="ms-score">💣 Mines: <span id="msMineCount">10</span> &nbsp;|&nbsp; 🚩 Flags: <span id="msFlagCount">0</span></div>
    <div class="ms-grid" id="msGrid"></div>
    <div class="ms-win" id="msWin">🎉 You Win! All mines flagged!</div>
    <div class="ms-controls">
      <button class="ms-btn" id="msNewGame">🔄 New Game</button>
</main>
<div class="powered-by"><a href="https://toolstand.io/tools/minesweeper/" target="_blank" rel="noopener">Powered by ToolStand Minesweeper</a></div>
<script>
(function(){
  'use strict';
const DIFFICULTY = {
  easy: { rows: 9, cols: 9, mines: 10 },
  medium: { rows: 16, cols: 16, mines: 40 },
  hard: { rows: 30, cols: 16, mines: 99 }
};
let currentLevel = 'easy';
let rows, cols, mines;
let grid = [], revealed = [], flagged = [], minePos = new Set();
let gameOver = false, flagCount = 0;

function setLevel(level) {
  currentLevel = level;
  const cfg = DIFFICULTY[level];
  rows = cfg.rows; cols = cfg.cols; mines = cfg.mines;
  document.querySelectorAll('.ms-diff-btn').forEach(b => b.classList.toggle('ms-active', b.dataset.level === level));
  initGame();
}

function initGame() {
  grid = Array.from({ length: rows }, () => Array(cols).fill(0));
  revealed = Array.from({ length: rows }, () => Array(cols).fill(false));
  flagged = Array.from({ length: rows }, () => Array(cols).fill(false));
  minePos = new Set();
  gameOver = false; flagCount = 0;

  while (minePos.size < mines) {
    const r = Math.floor(Math.random() * rows);
    const c = Math.floor(Math.random() * cols);
    minePos.add(r * cols + c);
  }

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      if (minePos.has(r * cols + c)) { grid[r][c] = -1; continue; }
      let count = 0;
      for (let dr = -1; dr <= 1; dr++)
        for (let dc = -1; dc <= 1; dc++)
          if ((dr || dc) && r+dr >= 0 && r+dr < rows && c+dc >= 0 && c+dc < cols && minePos.has((r+dr)*cols+(c+dc))) count++;
      grid[r][c] = count;
    }
  }
  updateUI(); render();
}

function flood(r, c) {
  if (r < 0 || r >= rows || c < 0 || c >= cols) return;
  if (revealed[r][c] || flagged[r][c]) return;
  revealed[r][c] = true;
  if (grid[r][c] === 0) {
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++)
        if (dr || dc) flood(r+dr, c+dc);
  }
}

function reveal(r, c) {
  if (gameOver || revealed[r][c] || flagged[r][c]) return;
  if (minePos.has(r * cols + c)) {
    gameOver = true;
    minePos.forEach(pos => { revealed[Math.floor(pos/cols)][pos%cols] = true; });
    render(); return;
  }
  flood(r, c);
  checkWin(); render();
}

function toggleFlag(r, c) {
  if (gameOver || revealed[r][c]) return;
  if (flagged[r][c]) { flagged[r][c] = false; flagCount--; }
  else { if (flagCount >= mines) return; flagged[r][c] = true; flagCount++; }
  updateUI(); render();
}

function checkWin() {
  let allSafe = true;
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      if (!minePos.has(r*cols+c) && !revealed[r][c]) allSafe = false;
  if (allSafe) { gameOver = true; document.getElementById('msWin').classList.add('ms-show'); }
}

function updateUI() {
  document.getElementById('msMineCount').textContent = mines;
  document.getElementById('msFlagCount').textContent = flagCount;
}

function render() {
  const gridEl = document.getElementById('msGrid');
  gridEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  gridEl.innerHTML = '';
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const cell = document.createElement('button');
      cell.className = 'ms-cell'; cell.dataset.row = r; cell.dataset.col = c;
      if (revealed[r][c]) {
        cell.classList.add('ms-revealed');
        if (grid[r][c] === -1) { cell.classList.add('ms-mine'); cell.textContent = '💣'; }
        else if (grid[r][c] > 0) { cell.textContent = grid[r][c]; cell.classList.add('ms-num-'+grid[r][c]); }
      } else if (flagged[r][c]) { cell.classList.add('ms-flagged'); cell.textContent = '🚩'; }
      gridEl.appendChild(cell);
    }
  }
}

const gridEl = document.getElementById('msGrid');
gridEl.addEventListener('click', e => { const c = e.target.closest('.ms-cell'); if (c) reveal(parseInt(c.dataset.row), parseInt(c.dataset.col)); });
gridEl.addEventListener('contextmenu', e => { e.preventDefault(); const c = e.target.closest('.ms-cell'); if (c) toggleFlag(parseInt(c.dataset.row), parseInt(c.dataset.col)); });
// Long-press for flag on mobile
let longPressTimer;
gridEl.addEventListener('touchstart', e => {
  const cell = e.target.closest('.ms-cell');
  if (!cell) return;
  const r = parseInt(cell.dataset.row), c = parseInt(cell.dataset.col);
  longPressTimer = setTimeout(() => toggleFlag(r, c), 500);
});
gridEl.addEventListener('touchend', () => clearTimeout(longPressTimer));
gridEl.addEventListener('touchmove', () => clearTimeout(longPressTimer));

document.getElementById('msNewGame').addEventListener('click', () => {
  document.getElementById('msWin').classList.remove('ms-show');
  initGame();
});
document.getElementById('msDifficulty').addEventListener('click', e => {
  if (e.target.tagName === 'BUTTON' && e.target.dataset.level) setLevel(e.target.dataset.level);
});

setLevel('easy');

const themeToggle = const savedTheme = localStorage.getItem('toolstand-theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
themeToggle?.addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('toolstand-theme', next);
  render();
});
  var s=localStorage.getItem('toolstand-theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
})();
</script>
</body></html>
