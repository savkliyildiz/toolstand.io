<script src="/shared/analytics.js" defer></script></head><body><main><div class="ntw-c"><div class="ntw-row"><input type="text" class="ntw-i" id="ntwIn" placeholder="Enter a number (e.g. 1234567)" inputmode="numeric" autofocus><select class="ntw-sel" id="ntwLang"><option value="en">🇬🇧 English</option><option value="tr">🇹🇷 Türkçe</option><option value="de">🇩🇪 Deutsch</option><option value="fr">🇫🇷 Français</option><option value="es">🇪🇸 Español</option><option value="ar">🇸🇦 العربية</option><option value="hi">🇮🇳 हिन्दी</option><option value="zh">🇨🇳 中文</option></select></div><div class="ntw-o" id="ntwOut"><span class="ntw-label">Words</span><div id="ntwResult" style="margin-top:2px"></div><button class="ntw-copy" id="ntwCopy" title="Copy to clipboard">📋 Copy</button></div></div><div class="powered-by"><a href="https://toolstand.io/tools/number-to-words/" target="_blank" rel="noopener">Powered by ToolStand Number to Words Converter</a></div></main><script>(function(){var inp=document.getElementById("ntwIn"),lng=document.getElementById("ntwLang"),res=document.getElementById("ntwResult"),cpy=document.getElementById("ntwCopy");
function numToWords(n,lang){
  if(n===undefined||n===null||n==="")return "";
  var s=String(n).replace(/[,\s]/g,"");
  if(!/^-?\d+(\.\d+)?$/.test(s))return "Invalid input";

  var intPart,decPart,decStr="";
  var dp=numStr.indexOf(".");
  if(dp>=0){intPart=numStr.slice(0,dp);decPart=numStr.slice(dp+1);if(decPart){var digs=decPart.split("").map(function(d){return digitWord(parseInt(d),lang)});decStr=" "+POINT[lang]+" "+digs.join(" ")}}
  else intPart=numStr;

  var words="";
  if(intVal===0n)words=ZERO[lang];
  else words=convertInt(intVal,lang);
  if(neg)words=MINUS[lang]+" "+words;
  return words+decStr;
}
var ONES={en:["","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"],tr:["","bir","iki","üç","dört","beş","altı","yedi","sekiz","dokuz","on","on bir","on iki","on üç","on dört","on beş","on altı","on yedi","on sekiz","on dokuz"],de:["","eins","zwei","drei","vier","fünf","sechs","sieben","acht","neun","zehn","elf","zwölf","dreizehn","vierzehn","fünfzehn","sechzehn","siebzehn","achtzehn","neunzehn"],fr:["","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize","dix-sept","dix-huit","dix-neuf"],es:["","uno","dos","tres","cuatro","cinco","seis","siete","ocho","nueve","diez","once","doce","trece","catorce","quince","dieciséis","diecisiete","dieciocho","diecinueve"],ar:["","واحد","اثنان","ثلاثة","أربعة","خمسة","ستة","سبعة","ثمانية","تسعة","عشرة","أحد عشر","اثنا عشر","ثلاثة عشر","أربعة عشر","خمسة عشر","ستة عشر","سبعة عشر","ثمانية عشر","تسعة عشر"],hi:["","एक","दो","तीन","चार","पाँच","छह","सात","आठ","नौ","दस","ग्यारह","बारह","तेरह","चौदह","पंद्रह","सोलह","सत्रह","अठारह","उन्नीस"]};

function digitWord(d,lang){if(lang==="zh")return ZH_DIGITS[d];return ONES[lang][d]||""}

function convertInt(n,lang){
  if(lang==="zh")return convertZh(n);

function convertStandard(n,lang){

}
function convertZh(n){
  if(n===0n)return ZH_DIGITS[0];
  var segs=[],val=n;
  while(val>0n){segs.push(val%10000n);val=val/10000n}

    var seg=segs[i];
    if(seg===0n){if(i===0&&parts.length===0)parts.push(ZH_DIGITS[0]);continue}
    var s="",d4=Number(seg%10n),d3=Number((seg/10n)%10n),d2=Number((seg/100n)%10n),d1=Number((seg/1000n)%10n);
    if(d1>0){s+=ZH_DIGITS[d1]+ZH_UNITS[3];if(d2===0&&(d3>0||d4>0))s+=ZH_DIGITS[0]}
    if(d2>0)s+=ZH_DIGITS[d2]+ZH_UNITS[2];else if(d1>0&&(d3>0||d4>0))s+=ZH_DIGITS[0];

    if(i>0)s+=ZH_BIG[i];

  }
