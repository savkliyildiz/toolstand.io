<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decibel Meter — Embed</title>
<link rel="stylesheet" href="/shared/styles.css">
<script type="application/ld+json">{"@context":"https://schema.org","@type":["WebApplication","SoftwareApplication"],"name":"Decibel Meter","url":"https://toolstand.io/tools/decibel-meter/","applicationCategory":"UtilityApplication","operatingSystem":"All","offers":{"@type":"Offer","price":"0","priceCurrency":"USD"},"isAccessibleForFree":true}</script>
<style>
.header,.footer,.embed-cta,#embed-section,.ad-banner{display:none}
/* ── Decibel Meter Styles ──────────────────────────────── */
.dbm-container {
  max-width: 600px;
  margin: 0 auto;
  padding: 40px 20px;
}

.dbm-header {
  text-align: center;
  margin-bottom: 24px;
}

.dbm-header h1 {
  font-size: 1.8rem;
  font-weight: 800;
}

.dbm-header p {
  color: var(--text-secondary);
  font-size: 1rem;
}

/* Large dB number */
.dbm-reading {
  text-align: center;
  margin-bottom: 4px;
}

.dbm-value {
  font-size: 7rem;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  transition: color 0.3s;
}

.dbm-unit {
  font-size: 1.2rem;
  font-weight: 600;
  color: var(--text-secondary);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin-top: -4px;
}

.dbm-value.zone-green  { color: #16a34a; }
.dbm-value.zone-yellow { color: #ca8a04; }
.dbm-value.zone-orange { color: #ea580c; }
.dbm-value.zone-red    { color: #dc2626; }

[data-theme="dark"] .dbm-value.zone-green  { color: #4ade80; }
[data-theme="dark"] .dbm-value.zone-yellow { color: #facc15; }
[data-theme="dark"] .dbm-value.zone-orange { color: #fb923c; }
[data-theme="dark"] .dbm-value.zone-red    { color: #f87171; }

/* Peak hold */
.dbm-peak {
  text-align: center;
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 16px;
  min-height: 1.4em;
}

.dbm-peak span {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: #dc2626;
}

[data-theme="dark"] .dbm-peak span {
  color: #f87171;
}

/* Arc gauge */
.dbm-gauge {
  display: flex;
  justify-content: center;
  margin-bottom: 20px;
}

.dbm-gauge svg {
  width: 220px;
  height: 130px;
  overflow: visible;
}

.gauge-bg {
  fill: none;
  stroke: var(--border);
  stroke-width: 20;
  stroke-linecap: round;
}

.gauge-arc {
  fill: none;
  stroke-width: 20;
  stroke-linecap: round;
  transition: stroke 0.3s, stroke-dashoffset 0.15s;
}

/* Controls */
.dbm-controls {
  display: flex;
  gap: 12px;
  justify-content: center;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 24px;
}

.btn-mic {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  background: var(--primary);
  color: white;
  border: none;
  font-size: 1.6rem;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
  box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
}

.btn-mic:hover {
  background: var(--primary-hover);
  transform: scale(1.05);
}

.btn-mic:active {
  transform: scale(0.95);
}

.btn-mic.active {
  background: #ef4444;
  box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);
  animation: pulse-mic 2s ease-in-out infinite;
}

.btn-mic.active:hover {
  background: #dc2626;
}

@keyframes pulse-mic {
  0%, 100% { box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3); }
  50% { box-shadow: 0 2px 20px rgba(239, 68, 68, 0.5); }
}

/* Weighting toggle */
.weighting-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}

.weighting-btn {
  padding: 10px 20px;
  background: var(--bg-card);
  border: none;
  cursor: pointer;
  font-size: 0.9rem;
  font-weight: 600;
  color: var(--text-secondary);
  transition: all 0.15s;
}

.weighting-btn.active {
  background: var(--primary);
  color: white;
}

.weighting-btn:not(.active):hover {
  background: var(--border);
}

/* Permission needed fallback */
.dbm-permission {
  display: none;
  text-align: center;
  padding: 40px 20px;
}

.dbm-permission.visible {
  display: block;
}

.dbm-permission-icon {
  font-size: 3rem;
  margin-bottom: 12px;
}

.dbm-permission h2 {
  font-size: 1.3rem;
  margin-bottom: 8px;
}

.dbm-permission p {
  color: var(--text-secondary);
  font-size: 0.95rem;
  max-width: 360px;
  margin: 0 auto 20px;
}

/* Labels for arc */
.dbm-labels {
  display: flex;
  justify-content: space-between;
  max-width: 220px;
  margin: -12px auto 0;
  font-size: 0.7rem;
  color: var(--text-secondary);
  padding: 0 14px;
}

/* Embed CTA */
.embed-cta {
  margin-top: 40px;
  padding: 20px;
  background: var(--bg-card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
  text-align: center;
}

.embed-cta h3 { margin-bottom: 8px; }

.embed-code {
  width: 100%;
  padding: 12px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: monospace;
  font-size: 0.8rem;
  color: var(--text);
  resize: vertical;
  margin-top: 8px;
}

/* Responsive */
@media (max-width: 640px) {
  .dbm-value { font-size: 5rem; }
  .dbm-gauge svg { width: 180px; height: 106px; }
  .dbm-labels { max-width: 180px; }
}
.powered-by{text-align:center;padding:12px;margin-top:16px;font-size:.75rem;color:var(--text-secondary)}
.powered-by a{color:var(--accent);text-decoration:none;font-weight:600}
</style>
<script src="/shared/bot-detect.js" defer></script>
<script src="/shared/analytics.js"></script>
</head><body class="embed-page">
<main class="tool-container">
<!-- Permission needed fallback -->
  <div class="dbm-permission" id="permissionBlock">
    <div class="dbm-permission-icon">🎤</div>
    <h2>Microphone access needed</h2>
    <p>This tool needs access to your microphone to measure sound levels. No audio is recorded or sent anywhere.</p>
    <button class="btn" id="btnRequestMic">Allow Microphone</button>
  </div>

  <!-- Active meter (hidden until mic granted) -->
  <div id="meterBlock" style="display:none">

    <div class="dbm-header">
      <h1>🎤 Decibel Meter</h1>
      <p>Real-time sound level measurement</p>
    </div>

    <!-- Large dB reading -->
    <div class="dbm-reading">
      <div class="dbm-value zone-green" id="dbValue">0</div>
      <div class="dbm-unit">dB</div>
    </div>

    <!-- Peak hold -->
    <div class="dbm-peak">
      Peak: <span id="dbPeak">0</span> dB
      <button id="btnResetPeak" class="btn-icon" style="margin-left:6px;font-size:0.75rem;padding:2px 8px" title="Reset peak">↺</button>
    </div>

    <!-- Arc gauge -->
    <div class="dbm-gauge">
      <svg viewBox="0 0 220 130" xmlns="http://www.w3.org/2000/svg">
        <!-- Background track arc: from ~225° to ~315° (270° span) -->
        <!-- Center (110, 120), r=90. Arc path from left to right along bottom. -->
        <path class="gauge-bg"
              d="M 25 120 A 90 90 0 0 1 195 120"
              id="gaugeBg" />
        <!-- Foreground arc -->
        <path class="gauge-arc"
              d="M 25 120 A 90 90 0 0 1 195 120"
              id="gaugeArc"
              stroke="#16a34a"
              stroke-dasharray="282.74 282.74"
              stroke-dashoffset="282.74" />
      </svg>
    </div>

    <div class="dbm-labels">
      <span>0</span>
      <span>60</span>
      <span>120</span>
    </div>

    <!-- Controls -->
    <div class="dbm-controls">
      <button id="btnMic" class="btn-mic" aria-label="Start / Stop microphone" title="Start / Stop microphone">▶</button>

      <!-- Weighting toggle -->
      <div class="weighting-toggle" id="weightingToggle">
        <button class="weighting-btn active" data-mode="fast">Fast</button>
        <button class="weighting-btn" data-mode="slow">Slow</button>
      </div>
    </div>

  </div>

  <!-- Embed CTA -->
</main>
<div class="powered-by"><a href="https://toolstand.io/tools/decibel-meter/" target="_blank" rel="noopener">Powered by ToolStand Decibel Meter</a></div>
<script>
(function(){
  'use strict';

  var s=localStorage.getItem('toolstand-theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
})();
</script>
</body></html>
