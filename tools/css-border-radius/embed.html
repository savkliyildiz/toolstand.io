<style>
.header,.footer,.embed-cta,#embed-section,.ad-banner{display:none}
.bdr-container { display: flex; flex-direction: column; gap: 20px; }
.bdr-preview-wrapper { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 60px 20px; display: flex; align-items: center; justify-content: center; min-height: 200px; }
.bdr-preview-box { width: 200px; height: 200px; background: linear-gradient(135deg, #06b6d4, #8b5cf6); transition: border-radius 0.2s; }
.bdr-controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
.bdr-control { display: flex; flex-direction: column; gap: 6px; }
.bdr-control label { font-size: 0.85rem; font-weight: 600; color: var(--text); display: flex; justify-content: space-between; }
.bdr-control label span { color: var(--text-secondary); font-weight: 400; }
.bdr-control input[type="range"] { width: 100%; accent-color: #06b6d4; }
.bdr-toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.bdr-toolbar button { padding: 8px 16px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg-card); color: var(--text); font-size: 0.85rem; cursor: pointer; font-weight: 500; transition: all 0.15s; }
.bdr-toolbar button:hover { border-color: #06b6d4; color: #06b6d4; }
.bdr-toolbar button.locked { background: #06b6d4; color: white; border-color: #06b6d4; }
.bdr-unit-toggle { display: flex; gap: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.bdr-unit-toggle button { padding: 8px 16px; border: none; background: var(--bg-card); color: var(--text); font-size: 0.85rem; cursor: pointer; font-weight: 500; }
.bdr-unit-toggle button.active { background: #06b6d4; color: white; }
.bdr-output { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace; font-size: 0.85rem; color: var(--text); word-break: break-all; cursor: pointer; }
.bdr-output:hover { border-color: #06b6d4; }
.bdr-copy-btn { padding: 10px 22px; background: #06b6d4; color: white; border: none; border-radius: var(--radius); font-size: 0.9rem; font-weight: 600; cursor: pointer; align-self: flex-start; transition: opacity 0.15s; }
.bdr-copy-btn:hover { opacity: 0.9; }
.powered-by{text-align:center;padding:12px;margin-top:16px;font-size:.75rem;color:var(--text-secondary)}

</style>

</head><body class="embed-page">
<main class="tool-container">
<div class="tool-header">
    <h1>⭕ CSS Border Radius Generator — Rounded Corners Visual Tool</h1>
    <p>Generate CSS border-radius visually. Control each corner individually with live preview. Free for web developers.</p>
  </div>

  <div class="bdr-container">
    <div class="bdr-preview-wrapper">
      <div class="bdr-preview-box" id="bdrPreviewBox"></div>
    </div>

    <div class="bdr-toolbar">
      <button id="bdrLockBtn" class="locked" title="Lock/unlock uniform corners">🔒 Uniform</button>
      <div class="bdr-unit-toggle" id="bdrUnitToggle">
        <button class="active" data-unit="px">px</button>
        <button data-unit="%">%</button>
      </div>
      <span style="font-size:0.8rem;color:var(--text-secondary);margin-left:8px">Max: <span id="bdrMaxLabel">200px</span></span>
    </div>

    <div class="bdr-controls">
      <div class="bdr-control">
        <label>↖ Top-Left <span id="bdrTLVal">0px</span></label>
        <input type="range" id="bdrTL" min="0" max="200" value="0">
      </div>
      <div class="bdr-control">
        <label>↗ Top-Right <span id="bdrTRVal">0px</span></label>
        <input type="range" id="bdrTR" min="0" max="200" value="0">
      </div>
      <div class="bdr-control">
        <label>↙ Bottom-Left <span id="bdrBLVal">0px</span></label>
        <input type="range" id="bdrBL" min="0" max="200" value="0">
      </div>
      <div class="bdr-control">
        <label>↘ Bottom-Right <span id="bdrBRVal">0px</span></label>
        <input type="range" id="bdrBR" min="0" max="200" value="0">
      </div>
    </div>

    <div class="bdr-output" id="bdrOutput" title="Click to copy CSS"></div>
    <button class="bdr-copy-btn" id="bdrCopyBtn">📋 Copy CSS</button>
  </div>

    

  <section class="seo-content">
</main>
<div class="powered-by"><a href="https://toolstand.io/tools/css-border-radius/" target="_blank" rel="noopener">Powered by ToolStand CSS Border Radius Generator</a></div>
<script>
(function(){
  'use strict';
var locked = true;
  var unit = 'px';
  var maxVal = 200;

  function updateAllFrom(val, sourceId) {
    ['bdrTL', 'bdrTR', 'bdrBL', 'bdrBR'].forEach(function(id) {
      if (id !== sourceId) document.getElementById(id).value = val;
    });
    update();
  }

  function update() {
    var tl = parseInt(document.getElementById('bdrTL').value);
    var tr = parseInt(document.getElementById('bdrTR').value);
    var bl = parseInt(document.getElementById('bdrBL').value);
    var br = parseInt(document.getElementById('bdrBR').value);

    var label = unit === 'px' ? unit : unit;
    document.getElementById('bdrTLVal').textContent = tl + label;
    document.getElementById('bdrTRVal').textContent = tr + label;
    document.getElementById('bdrBLVal').textContent = bl + label;
    document.getElementById('bdrBRVal').textContent = br + label;

    var cssValue = tl + unit + ' ' + tr + unit + ' ' + br + unit + ' ' + bl + unit;
    document.getElementById('bdrPreviewBox').style.borderRadius = cssValue;
    document.getElementById('bdrOutput').textContent = 'border-radius: ' + cssValue + ';';
  }

  // Lock button
  document.getElementById('bdrLockBtn').addEventListener('click', function() {
    locked = !locked;
    this.textContent = locked ? '🔒 Uniform' : '🔓 Individual';
    this.classList.toggle('locked', locked);
    if (locked) {
      var val = document.getElementById('bdrTL').value;
      updateAllFrom(val, 'bdrTL');
    }
  });

  // Unit toggle
  document.getElementById('bdrUnitToggle').addEventListener('click', function(e) {
    if (e.target.tagName !== 'BUTTON') return;
    var btns = this.querySelectorAll('button');
    btns.forEach(function(b) { b.classList.remove('active'); });
    e.target.classList.add('active');
    unit = e.target.dataset.unit;
    maxVal = unit === 'px' ? 200 : 100;
    document.getElementById('bdrMaxLabel').textContent = maxVal + (unit === 'px' ? 'px' : '%');
    ['bdrTL', 'bdrTR', 'bdrBL', 'bdrBR'].forEach(function(id) {
      var el = document.getElementById(id);
      el.max = maxVal;
      if (parseInt(el.value) > maxVal) el.value = maxVal;
    });
    update();
  });

  // Slider inputs
  ['bdrTL', 'bdrTR', 'bdrBL', 'bdrBR'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', function() {
      if (locked) updateAllFrom(this.value, this.id);
      else update();
    });
  });

  // Copy
  document.getElementById('bdrCopyBtn').addEventListener('click', function() {
    navigator.clipboard.writeText(document.getElementById('bdrOutput').textContent).then(function() {
      var btn = document.getElementById('bdrCopyBtn');
      btn.textContent = '✅ Copied!';
      setTimeout(function() { btn.textContent = '📋 Copy CSS'; }, 1500);
    });
  });

  document.getElementById('bdrOutput').addEventListener('click', function() {
    navigator.clipboard.writeText(this.textContent).then(function() {
      var out = document.getElementById('bdrOutput');
      out.style.background = 'rgba(6, 182, 212, 0.15)';
      setTimeout(function() { out.style.background = ''; }, 400);
    });
  });

  update();
  var s=localStorage.getItem('toolstand-theme')||'light';
  document.documentElement.setAttribute('data-theme',s);
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
})();
</script>
</body></html>
